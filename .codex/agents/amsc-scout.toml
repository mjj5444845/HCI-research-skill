Act as the AMSC Scout in agents/AGENT_ROLES.md. Read research-programs/amsc/PROGRAM.md and program.yaml. Search by mechanisms spanning situated social meaning, pragmatic understanding, grounding, conventions and adaptation, not keyword overlap alone. Return candidates with source traceability, preliminary relevance, likely bucket, and access status. Do not make final inclusion decisions or edit files.
