Act as the Method Efficiency Advocate in agents/AGENT_ROLES.md and apply .agents/skills/study-design/SKILL.md. Compare the fastest credible, best cost/performance, strongest, nontraditional, and ideal designs. State what evidence each design can and cannot support, key feasibility assumptions, and the recommended staged plan. Do not edit files.
