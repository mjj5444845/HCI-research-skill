version: "2.1"
gaps:
  - id: GAP-01
    statement: How AI detects and updates interaction-dependent multimodal meanings; a long-term candidate
      requiring a concrete task and mechanism.
    status: REDEFINED
    priority: low
    evidence:
      - paper_slug: c6-visual-resemblance-interaction-history
        evidence_level: MODERATE
        supports: Interaction history changes pictorial meaning within a repeated human-human drawing paradigm.
        boundary: Controlled human drawing; yoked-vs-shuffled isolates same-producer sequence exposure, not
          mutual common ground or embodied-agent detection.
      - paper_slug: x12-partners-to-populations
        evidence_level: MODERATE
        supports: CHAI models how partner-specific common ground and population conventions coexist and transfer.
        boundary: Human linguistic coordination and simulation; no embodied human–AI agent.
      - paper_slug: c8-gesturing-toward-abstraction
        evidence_level: MODERATE
        supports: Human physical dyads develop and reuse speech/gesture abstractions with diverging dyad
          vocabularies.
        boundary: No Agent, partner swap, history severing or transfer.
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: An artificial listener updates linguistic reference expectations online from interaction
          history.
        boundary: One-sided visual-reference adaptation; non-embodied and no dyad/population transfer.
      - paper_slug: x23-machine-mental-imagery-common-ground
        evidence_level: PRELIMINARY
        supports: Incrementally externalizes dialogue-derived visual and textual state and distinguishes
          confirmed, unresolved and assumed content.
        boundary: Offline QA over human dialogue traces; system-side state tracking is not partner-specific
          meaning change or mutual common ground.
      - paper_slug: x1-spotter-human-robot-conventions
        evidence_level: PRELIMINARY
        supports: SPOTTER 的 21 名成人 WoZ 试验显示描述趋于稳定但未清晰缩短；它提供动态视觉指称框架，不证明自主机器人形成互惠惯例。
        boundary: 21名成人的探索性描述复用，不等于自主机器人学习、HH/HRI等价、共同历史的因果作用或长期惯例。无显著性结果不能补写为不存在效应。
    skeptic_challenge: Human meaning formation, visual conventions and partner-to-population transfer have
      direct precedents. Choose a concrete claim and compare the closest work; no robot, repair or
      transfer requirement applies to every understanding study. Do not dismiss Wizard-of-Oz work solely
      because it is non-autonomous or manufacture novelty by combining untested conditions.
    history:
      - date: 2026-08-27
        from: ACTIVE
        to: REDEFINED
        reason: C6 and X1 make a generic absence-of-meaning-formation claim too broad.
      - date: 2026-08-27
        from: REDEFINED
        to: REDEFINED
        reason: CHAI removes generic transfer-theory absence; residual opportunity is embodied human–AI inference
          across dyad and population levels.
      - date: 2026-09-07
        from: REDEFINED
        to: REDEFINED
        reason: X23 supplies an inspectable multimodal state-representation architecture but leaves
          partner-specific meaning change, mutual acceptance and embodied online updating untested.
      - date: 2026-09-12
        from: REDEFINED
        to: REDEFINED
        reason: 五篇积压全文补审及独立gap_red_team复核；保留既有状态与优先级。X1是直接WoZ先例，X3组件混杂，X4开放记忆未实测，X5为概念综述，不能计为独立实证重复。
      - date: 2026-09-18
        from: REDEFINED
        to: REDEFINED
        reason: "User-authorized scope/priorities change, not new evidence. Previous statement: How an embodied
          agent detects and updates interaction-history-dependent multimodal meaning across dyad and
          population levels"
    scope_status: LONG_TERM
    scope_note: 方向相关性不等于新颖性；长期问题不再强制作为首项研究。
  - id: GAP-02
    statement: Mutual human–AI conventions whose formation is counterfactually dependent on shared
      interaction history, followed by repair and transfer tests
    status: PARTIALLY_ADDRESSED
    priority: low
    evidence:
      - paper_slug: x25-seeing-is-not-sharing
        evidence_level: MODERATE
        supports: Some VLMs conflate available task content with established referential alignment in MapTask
          overhearer judgments.
        boundary: Model-specific responses; one corpus and no interactive grounding.
      - paper_slug: x26-convention-gap
        evidence_level: MODERATE
        supports: A literal-posterior residual measures beyond-literal Hanabi cooperation but does not identify
          jointly formed conventions.
        boundary: Retrospective measurement; unilateral adaptation and shared convention remain separable
          hypotheses.
      - paper_slug: x29-testing-interchangeability
        evidence_level: PRELIMINARY
        supports: Role-matched swaps provide intervention evidence that formed notebook-equipped LLM dyads are
          not fully interchangeable in coordination cost.
        boundary: Formation-order/task-note differences remain; four swap pairs per setting, no human partners or
          mutual-meaning test; recovery arithmetic requires clarification.
      - paper_slug: x1-spotter-human-robot-conventions
        evidence_level: PRELIMINARY
        supports: SPOTTER 的 21 名成人 WoZ 试验显示描述趋于稳定但未清晰缩短；它提供动态视觉指称框架，不证明自主机器人形成互惠惯例。
        boundary: 21名成人的探索性描述复用，不等于自主机器人学习、HH/HRI等价、共同历史的因果作用或长期惯例。无显著性结果不能补写为不存在效应。
      - paper_slug: x8-success-cost-convention-formation
        evidence_level: MODERATE
        supports: Success×cost post-training yields convention-like efficiency gains with human listeners.
        boundary: Fixed model-speaker role; no mutual negotiation, history ablation, repair, or embodiment.
      - paper_slug: x9-aligned-not-partner-specific
        evidence_level: MODERATE
        supports: Pseudo-dyad controls show that high overlap and success can persist after partner history is
          severed.
        boundary: Preprint and AI–AI dyads; does not rule out partner-specificity under other regimes.
      - paper_slug: x12-partners-to-populations
        evidence_level: MODERATE
        supports: Dyad-originated conventions can later transfer toward population expectations.
        boundary: Partner-specific origin must not be defined as permanent non-transferability.
      - paper_slug: c3-conceptual-pacts
        evidence_level: MODERATE
        supports: A classic human partner-switch experiment shows partner-specific lexical history changes later
          reference choice.
        boundary: Only four key items; item-level partner effect was marginal and not multimodal or human–AI.
      - paper_slug: c8-gesturing-toward-abstraction
        evidence_level: MODERATE
        supports: Human dyads form multimodal abstractions in repeated physical collaboration.
        boundary: No human–AI reciprocity or counterfactual history manipulation.
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: Human speakers and an adaptive listener achieve convention-like online efficiency gains.
        boundary: One-sided model adaptation without partner swap, repair or embodiment.
      - paper_slug: x17-glossogen-emergent-language
        evidence_level: PRELIMINARY
        supports: Adds explicit AI–AI protocol negotiation, history dosage, one-agent swap, newcomer uptake, and
          clarification behavior.
        boundary: Prompt-sanctioned shorthand with free postmortems, no humans or physical embodiment, and only
          one replacement generation.
      - paper_slug: x20-passing-the-pact
        evidence_level: PRELIMINARY
        supports: Abstract reports conceptual-pact reuse with less-knowledgeable human and agent interlocutors
          plus weaker knowledge-sensitive elaboration toward agents.
        boundary: Speaker behavior only; no verified agent learning, mutual belief, equivalence, embodiment or
          shared-history counterfactual.
      - paper_slug: x22-banana-man-pragmatic-interpretation
        evidence_level: MODERATE
        supports: Separates retrieval of externally supplied game-specific mappings from endogenous accumulation
          and error recovery under limited feedback.
        boundary: Naïve VLM interpretation of archived human games, not reciprocal human–AI convention formation.
      - paper_slug: x2-lvlms-humans-ground-differently
        evidence_level: PRELIMINARY
        supports: 四种角色组合的89对篮子指称任务揭示GPT-5.2配置与人类的协作轨迹差异；不能把感知、错序和prompt故障统称为缺乏共同基础。
        boundary: 描述性比较支持该配置的轨迹差异；无history
          ablation，不能证明历史无贡献或所有LVLM不能grounding。README与论文关于排序/反馈存在配置差异，复现需核对branch/commit。
    skeptic_challenge: Do not preserve novelty through adjectives. Human–agent pact reuse and VLM retrieval
      of established mappings now have direct precedents. Demonstrate counterfactual shared-history
      dependence, endogenous updating, reciprocity, repair and appropriate transfer.
      2026-09-12反方复核：不得以非自主为由排除WoZ先例，不得把修复/记忆更新说成从未研究；新增条件组合本身不是新颖性。
