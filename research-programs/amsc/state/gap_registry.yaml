      - date: 2026-09-03
        from: REDEFINED
        to: REDEFINED
        reason: "X18 adds a non-monotonic embodied social–functional boundary but does not test history-dependent signal adaptation or joint grounding."
    claimability: RESEARCH_OPPORTUNITY_NOT_FIELD_ABSENCE
    evidence_readiness: FULL_TEXT_BASELINE_COMPLETE_WITH_F6_ABSTRACT_ONLY
