version: 0.5
gaps:
  - id: GAP-01
    statement: "How an embodied agent detects and updates interaction-history-dependent multimodal meaning across dyad and population levels"
    status: REDEFINED
    priority: high
    evidence:
      - paper_slug: x14-bee-referential-code
        evidence_level: PRELIMINARY
        supports: "Makes ecological usefulness, body geometry, and coupled sender/receiver code change explicit in a referential-code transition."
        boundary: "Evolutionary bee-colony simulation; not interaction-timescale human–AI detection or multimodal social meaning."
      - paper_slug: c6-visual-resemblance-interaction-history
        evidence_level: MODERATE
        supports: "Interaction history changes pictorial meaning within a repeated human-human drawing paradigm."
        boundary: "Controlled human drawing; yoked-vs-shuffled isolates same-producer sequence exposure, not mutual common ground or embodied-agent detection."
      - paper_slug: x12-partners-to-populations
        evidence_level: MODERATE
        supports: "CHAI models how partner-specific common ground and population conventions coexist and transfer."
        boundary: "Human linguistic coordination and simulation; no embodied human–AI agent."
      - paper_slug: c8-gesturing-toward-abstraction
        evidence_level: MODERATE
        supports: "Human physical dyads develop and reuse speech/gesture abstractions with diverging dyad vocabularies."
        boundary: "No Agent, partner swap, history severing or transfer."
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: "An artificial listener updates linguistic reference expectations online from interaction history."
        boundary: "One-sided visual-reference adaptation; non-embodied and no dyad/population transfer."
    skeptic_challenge: "Human meaning formation, multimodal physical convention and partner-to-population transfer already have direct precedents; novelty must be counterfactual embodied-agent detection, repair and validated transfer rather than rediscovery."
    history:
      - date: 2026-08-27
        from: ACTIVE
        to: REDEFINED
        reason: "C6 and X1 make a generic absence-of-meaning-formation claim too broad."
      - date: 2026-08-27
        from: REDEFINED
        to: REDEFINED
        reason: "CHAI removes generic transfer-theory absence; residual opportunity is embodied human–AI inference across dyad and population levels."
  - id: GAP-02
    statement: "Mutual human–AI conventions whose formation is counterfactually dependent on shared interaction history, followed by repair and transfer tests"
    status: PARTIALLY_ADDRESSED
    priority: high
    evidence:
      - paper_slug: x1-spotter-human-robot-conventions
        evidence_level: PRELIMINARY
        supports: "Repeated human–robot reference interaction can produce stable task-specific linguistic conventions."
        boundary: "Controlled Dutch pilots do not establish reciprocal, history-dependent multimodal convention."
      - paper_slug: x8-success-cost-convention-formation
        evidence_level: MODERATE
        supports: "Success×cost post-training yields convention-like efficiency gains with human listeners."
        boundary: "Fixed model-speaker role; no mutual negotiation, history ablation, repair, or embodiment."
      - paper_slug: x9-aligned-not-partner-specific
        evidence_level: MODERATE
        supports: "Pseudo-dyad controls show that high overlap and success can persist after partner history is severed."
        boundary: "Preprint and AI–AI dyads; does not rule out partner-specificity under other regimes."
      - paper_slug: x12-partners-to-populations
        evidence_level: MODERATE
        supports: "Dyad-originated conventions can later transfer toward population expectations."
        boundary: "Partner-specific origin must not be defined as permanent non-transferability."
      - paper_slug: c3-conceptual-pacts
        evidence_level: MODERATE
        supports: "A classic human partner-switch experiment shows partner-specific lexical history changes later reference choice."
        boundary: "Only four key items; item-level partner effect was marginal and not multimodal or human–AI."
      - paper_slug: c8-gesturing-toward-abstraction
        evidence_level: MODERATE
        supports: "Human dyads form multimodal abstractions in repeated physical collaboration."
        boundary: "No human–AI reciprocity or counterfactual history manipulation."
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: "Human speakers and an adaptive listener achieve convention-like online efficiency gains."
        boundary: "One-sided model adaptation without partner swap, repair or embodiment."
      - paper_slug: x17-glossogen-emergent-language
        evidence_level: PRELIMINARY
        supports: "Adds explicit AI–AI protocol negotiation, history dosage, one-agent swap, newcomer uptake, and clarification behavior."
        boundary: "Prompt-sanctioned shorthand with free postmortems, no humans or physical embodiment, and only one replacement generation."
      - paper_slug: x19-continuous-worlds-vocabularies
        evidence_level: MODERATE
        supports: "Shows decentralized artificial populations can converge on grounded lexical conventions under perceptual heterogeneity."
        boundary: "Designer-specified convergence rules and population-level AI–AI games do not establish mutual human–AI or partner-specific common ground."
    skeptic_challenge: "Do not preserve novelty through adjectives. C3, C8 and E3 cover human partner history, physical multimodality and machine adaptation separately. Demonstrate counterfactual shared-history dependence, then separately test reciprocity, repair and appropriate transfer."
    history:
      - date: 2026-08-26
        from: HIGH_PRIORITY
        to: PARTIALLY_ADDRESSED
        reason: "SPOTTER directly studies convention formation in a visually grounded human–robot reference task; the broader multimodal and longitudinal problem remains open."
      - date: 2026-08-27
        from: PARTIALLY_ADDRESSED
        to: PARTIALLY_ADDRESSED
        reason: "Vaduguru weakens generic AI-incapacity claims; Wang and CHAI require history-dependence and transfer to be tested separately."
      - date: 2026-09-03
        from: PARTIALLY_ADDRESSED
        to: PARTIALLY_ADDRESSED
        reason: "GlossoGen and the canonical TACL continuous-worlds lineage close off broad AI-code-emergence claims; the residual remains mutual human–embodied-AI convention with counterfactual shared-history, repair and transfer tests."
  - id: GAP-03
    statement: "Convention lifecycle: establishment, maintenance, repair/revision, context-sensitive retirement, partner/context transfer, and renegotiation after breakdown"
    status: PARTIALLY_ADDRESSED
    priority: high
    evidence:
      - paper_slug: x14-bee-referential-code
        evidence_level: PRELIMINARY
        supports: "Demonstrates a feasible iconic-to-abstract referential code transition under coordinated sender/receiver change."
        boundary: "Across-generation simulation, not within-dyad human–AI renegotiation or repair."
      - paper_slug: x15-synthetic-linguistic-agency
        evidence_level: PRELIMINARY
        supports: "Shows persistent history-conditioned linguistic policy change after consequential partner responses."
        boundary: "Adaptation with fixed actions and scripted partners; no convention establishment, repair, retirement, or transfer."
      - paper_slug: x3-seeing-eye-to-eye
        evidence_level: PRELIMINARY
        supports: "A situated AR assistant can combine gaze, gesture, revisable memory, and accumulated common ground."
        boundary: "System-maintained contextual memory is not equivalent to mutual belief or convention."
      - paper_slug: x11-common-ground-benchmark
        evidence_level: MODERATE
        supports: "Human–AI joint-action and repair benchmark components already exist."
        boundary: "Single-model text/puzzle preprint without partner-history ablation or transfer."
      - paper_slug: x6-beyond-local-surprise
        evidence_level: PRELIMINARY
        supports: "Provides an explicit computational preserve/revise policy comparison."
        boundary: "No human validation; selective policy does not outperform conservative retrieval baselines."
      - paper_slug: x12-partners-to-populations
        evidence_level: MODERATE
        supports: "Provides theory and evidence for partner-to-population transfer."
        boundary: "No embodied Agent or multimodal repair."
      - paper_slug: c4-repeated-reference-games
        evidence_level: MODERATE
        supports: "Directly measures establishment, maintenance and feedback-contingent revision in repeated human reference."
        boundary: "No retirement, transfer, partner swap or embodiment."
      - paper_slug: c8-gesturing-toward-abstraction
        evidence_level: MODERATE
        supports: "Covers establishment and reuse of multimodal abstractions in human physical collaboration."
        boundary: "Natural corrections are not controlled repair; no retirement, transfer or Agent."
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: "Covers online establishment, local rehearsal and forgetting regularization for an artificial listener."
        boundary: "No reciprocal repair, retirement, partner/context transfer or embodiment."
      - paper_slug: e4-designing-robots-long-term
        evidence_level: MODERATE
        supports: "Provides nine-month deployment instrumentation and separates persistent traffic from identifiable repeat visitors."
        boundary: "No causal comparison, shared-meaning measure or convention lifecycle probe."
      - paper_slug: f5-robots-in-the-wild
        evidence_level: MODERATE
        supports: "Shows that roles, practices, third-party effects and time are boundary conditions for long-term HRI theory."
        boundary: "Research agenda and case synthesis, not a tested lifecycle mechanism."
      - paper_slug: f6-generative-encounters-robin
        evidence_level: PRELIMINARY
        supports: "Abstract-level evidence identifies organizational adaptation and appropriation across four eldercare facilities."
        boundary: "Full text was unavailable; no autonomous learning or convention evidence."
      - paper_slug: x17-glossogen-emergent-language
        evidence_level: PRELIMINARY
        supports: "Provides establishment, explicit negotiation, clarification, one partner swap, and limited protocol transmission components."
        boundary: "No controlled breakdown, retirement, multi-generation accumulation, human interaction, or physical embodiment."
      - paper_slug: x19-continuous-worlds-vocabularies
        evidence_level: MODERATE
        supports: "Provides population establishment, maintenance, and reorganization after sensor-loss perturbation."
        boundary: "No human–AI repair, partner-specific transfer, retirement, or open negotiation; adaptation follows engineered language-game rules."
    skeptic_challenge: "Lifecycle components are genuinely partially addressed across settings. Residual novelty is causal integration of repair, retirement, transfer, reciprocity and counterfactual shared history in embodied human–AI interaction."
    history:
      - date: 2026-08-26
        from: HIGH_PRIORITY
        to: REDEFINED
        reason: "Eye2Eye makes a generic absence-of-history claim untenable; the defensible gap concerns convention inference and lifecycle management."
      - date: 2026-08-27
        from: REDEFINED
        to: REDEFINED
        reason: "First-run recovery narrows lifecycle novelty from generic history/repair/transfer to integrated embodied human–AI convention control."
      - date: 2026-08-27
        from: REDEFINED
        to: PARTIALLY_ADDRESSED
        reason: "Top-20 audit finds direct component evidence for establishment/maintenance in human verbal, graphical and physical tasks and one-sided machine adaptation; repair, retirement, transfer, reciprocity and counterfactual history remain open."
      - date: 2026-09-03
        from: PARTIALLY_ADDRESSED
        to: PARTIALLY_ADDRESSED
        reason: "X17 and X19 strengthen AI-only establishment, transmission and perturbation-recovery components but do not integrate reciprocal human–AI repair, retirement, partner transfer or causal shared-history tests."
  - id: GAP-04
    statement: "Validate an integrated diagnostic stack that separates memory availability, natural integration, adaptation, task success, alignment, mutual belief, shared priors, and interaction-history-dependent convention"
    status: PARTIALLY_ADDRESSED
    priority: medium-high
    evidence:
      - paper_slug: x13-silica-agent-societies
        evidence_level: MODERATE
        supports: "Per-agent label-pool permutation and apparatus perturbations expose shared-prior and presentation-driven convention false positives."
        boundary: "AI–AI agent societies; pretrained label semantics remain shared and no embodied human–AI discriminant validation is provided."
      - paper_slug: x15-synthetic-linguistic-agency
        evidence_level: PRELIMINARY
        supports: "Mortal/reset and forced-output probes separate persistent bodily consequence from generic linguistic learning."
        boundary: "Scripted simulated ecology; does not distinguish mutual belief or convention."
      - paper_slug: x16-memuse-natural-integration
        evidence_level: MODERATE
        supports: "Directly separates memory availability and elicited retrieval from natural conversational integration."
        boundary: "Text-only deployment and observational satisfaction association; no partner-specific convention or embodiment."
      - paper_slug: x4-making-memories-together
        evidence_level: PRELIMINARY
        supports: "Transparent, co-constructed robot memory may provide infrastructure for negotiated personalization."
        boundary: "Shared memory does not demonstrate convention."
      - paper_slug: x9-aligned-not-partner-specific
        evidence_level: MODERATE
        supports: "Pseudo-dyads operationalize whether alignment depends on partner history."
        boundary: "Preprint and AI–AI only."
      - paper_slug: x11-common-ground-benchmark
        evidence_level: MODERATE
        supports: "A human–AI puzzle benchmark separates task, communication, and object-level grounding evidence."
        boundary: "Single model and no embodied multimodal lifecycle."
      - paper_slug: x7-embodied-world-model-alignment
        evidence_level: MODERATE
        supports: "Embodied agent metrics separate action conflict, task success, information novelty, and belief-sensitive messaging."
        boundary: "AI–AI simulation cannot establish human–AI common ground."
      - paper_slug: c3-conceptual-pacts
        evidence_level: MODERATE
        supports: "Provides a human partner-switch precedent for distinguishing lexical history from partner-independent reuse."
        boundary: "Lexical entrainment remains an imperfect proxy for shared representation."
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: "Pragmatic, rehearsal and KL ablations separate components of online adaptation."
        boundary: "Does not distinguish partner specificity, mutual belief or convention."
      - paper_slug: d9-anatomy-of-uncertainty
        evidence_level: PRELIMINARY
        supports: "Separates intended category recognition from descriptor-level intensity judgments for expressive uncertainty motion."
        boundary: "Preprint video study; no calibration to live uncertainty, task outcome or shared history."
      - paper_slug: g3-explainable-oohri
        evidence_level: PRELIMINARY
        supports: "Separates encoded capability, limitation, explanation and actionable repair channels in an AR architecture."
        boundary: "Small no-control study with authored tasks and substantial human setup; no longitudinal grounding."
      - paper_slug: x17-glossogen-emergent-language
        evidence_level: PRELIMINARY
        supports: "Combines success, language-form, productivity, history-dose, swap, and clarification probes in one AI–AI testbed."
        boundary: "Prompted protocol design and LLM-mediated linguistic measures limit construct validity."
      - paper_slug: x19-continuous-worlds-vocabularies
        evidence_level: MODERATE
        supports: "Separates communicative success from population lexical conventionality across perceptual and perturbation regimes."
        boundary: "Neither metric diagnoses mutual belief or counterfactual partner-history dependence."
    evidence_trend: PARTIALLY_ADDRESSED
    skeptic_challenge: "X9, X13, X16 and the baseline corpus show that component diagnostics already exist. A unified battery alone is no longer a strong novelty claim; the residual contribution must demonstrate discriminant validity across human–AI, embodied, multimodal and partner-transfer regimes."
    history:
      - date: 2026-08-26
        from: ACTIVE
        to: UNCHANGED
        reason: "Recent memory and convention papers strengthen the distinction but do not bridge it empirically."
      - date: 2026-08-27
        from: UNCHANGED
        to: REDEFINED
        reason: "The original distinction was a warning, not an operational gap; the revised form requires falsifiable diagnostic criteria."
      - date: 2026-08-27
        from: REDEFINED
        to: PARTIALLY_ADDRESSED
        reason: "Pseudo-dyad, common-ground benchmark, and world-model metrics resolve generic diagnostic absence; integration and embodied validation remain open."
      - date: 2026-08-31
        from: PARTIALLY_ADDRESSED
        to: PARTIALLY_ADDRESSED
        reason: "SILICA and MemUse add shared-prior and natural-integration diagnostics; novelty narrows further to discriminant-valid integration in embodied human–AI interaction."
      - date: 2026-09-03
        from: PARTIALLY_ADDRESSED
        to: PARTIALLY_ADDRESSED
        reason: "X17 and X19 add useful multi-measure AI-only diagnostics while reinforcing that success and lexical coherence do not establish mutual belief or history-dependent human–AI convention."
  - id: GAP-05
    statement: "Operationally connect informal/graphic paralanguage and multimodal structural relations to interaction-history-dependent, adaptive embodied human–AI communication"
    status: REDEFINED
    priority: medium-high
    evidence:
      - paper_slug: a2-textual-paralanguage
        evidence_level: PRELIMINARY
        supports: "Provides a broad, context-sensitive construct and coding vocabulary for textual/graphic paralanguage."
        boundary: "Descriptive marketing/CMC samples; no causal receiver effects, embodiment, history or Agent."
      - paper_slug: a5-multimodal-parallel-architecture
        evidence_level: PRELIMINARY
        supports: "Provides structural relations across verbal, bodily and graphic modalities."
        boundary: "Static theoretical architecture; no grounding, adaptation or Agent validation."
      - paper_slug: c8-gesturing-toward-abstraction
        evidence_level: MODERATE
        supports: "Shows history-evolving speech/gesture abstractions in controlled human physical collaboration."
        boundary: "No informal graphic paralanguage, human–AI dyad or counterfactual history test."
      - paper_slug: d6-designing-robots-with-movement
        evidence_level: PRELIMINARY
        supports: "Shows embodied movement already has a mature communicative design vocabulary."
        boundary: "Designer-authored mappings, not jointly negotiated or history-dependent."
      - paper_slug: a3-interpreting-emoji-pragmatics
        evidence_level: MODERATE
        supports: "Empirically shows that local discourse context changes perceived emoji pragmatic function."
        boundary: "Third-party Facebook interpretation, not dyadic emergence or robot-authored signals."
      - paper_slug: a4-a-visual-lexicon
        evidence_level: PRELIMINARY
        supports: "Provides a cross-granularity representation vocabulary for conventional and productive visual forms."
        boundary: "Conceptual analysis without behavioral validation or interactive formation."
      - paper_slug: a6-puppetchat
        evidence_level: PRELIMINARY
        supports: "Shows close dyads can appropriate editable embodied actions and micronarratives over a short deployment."
        boundary: "Eleven dyads, no causal control and no stable-convention test."
    skeptic_challenge: "A2, A5, C8 and D6 already provide construct, architecture, physical-convention and embodied-design building blocks. Novelty cannot be a new umbrella framework; it must operationalize a cross-layer mechanism and show causal behavioral gain. A3/A4/D/F/G closest-work audit remains required."
    history:
      - date: 2026-08-27
        from: ACTIVE
        to: UNCHANGED
        reason: "Status vocabulary normalized; claim remained unverified because relevant pages were bibliographic-only."
      - date: 2026-08-27
        from: UNCHANGED
        to: REDEFINED
        reason: "Top-20 full-text audit rejects a generic theory-absence claim and reframes the residual as an operational integration problem."
    claimability: OPEN_INTEGRATION_PROBLEM
    evidence_readiness: FULL_TEXT_BASELINE_COMPLETE
  - id: GAP-06
    statement: "How embodied agents jointly optimize and evaluate instrumental state/intent legibility and socially situated or relational meaning as multimodal signals adapt over interaction history"
    status: REDEFINED
    priority: medium-high
    evidence:
      - paper_slug: d5-legibility-and-predictability
        evidence_level: MODERATE
        supports: "Formally and behaviorally separates intent legibility from expected motion."
        boundary: "Goal-directed video trajectories; no social meaning, history or convention."
      - paper_slug: d6-designing-robots-with-movement
        evidence_level: PRELIMINARY
        supports: "Robot movement can expose task intent and affective/personality state in the same design material."
        boundary: "Design synthesis with fixed mappings; no common ground or longitudinal adaptation."
      - paper_slug: d7-social-eye-gaze-review
        evidence_level: MODERATE
        supports: "Gaze can coordinate reference, attention and turn-taking while also carrying rapport, emotion and social agency."
        boundary: "Non-systematic heterogeneous review; no partner-specific or history-conditioned convention."
      - paper_slug: a2-textual-paralanguage
        evidence_level: PRELIMINARY
        supports: "Social signal meaning is context-dependent and can supplement or replace prose."
        boundary: "CMC/marketing construct, not robot-state communication evidence."
      - paper_slug: d8-legible-multimodal-state-intent
        evidence_level: MODERATE
        supports: "Compares fixed gesture+speech and LED mappings across online and live settings for five state/intent messages."
        boundary: "Accepted/presented preprint with proceedings DOI pending; modality package is confounded."
      - paper_slug: d9-anatomy-of-uncertainty
        evidence_level: PRELIMINARY
        supports: "Provides a parameterized motion vocabulary for perceived uncertainty category and intensity."
        boundary: "Preprint, animator-authored video trajectories, no live uncertainty calibration."
      - paper_slug: g1-robot-motion-intent-ar
        evidence_level: MODERATE
        supports: "Demonstrates spatially registered future-action previews and distinct environment/robot/interface cue locations."
        boundary: "Single short aerial-robot task with fixed cues; no history-dependent adaptation."
      - paper_slug: g3-explainable-oohri
        evidence_level: PRELIMINARY
        supports: "Connects WHAT/WHERE/HOW capability communication to in-situ repair options."
        boundary: "Preliminary no-control study; no autonomous open-world assessment or convention."
      - paper_slug: f2-robots-in-society
        evidence_level: PRELIMINARY
        supports: "Frames social meaning and robot design as mutually shaped through deployment and appropriation."
        boundary: "Conceptual/ethnographic framework, not signal-level causal evidence."
      - paper_slug: x18-small-talk-rapport
        evidence_level: PRELIMINARY
        supports: "Shows that socially richer robot speech can reduce disclosure and coordination during physical collaboration."
        boundary: "Short single-platform study with disclosure-content/word-count confounding and no adaptive signal history."
    skeptic_challenge: "Top-20 evidence shows single motion and gaze signals can already carry functional and social meanings, so novelty cannot be first integration. The residual is history-dependent joint optimization, trade-off measurement and grounding across modalities; D/F/G closest-work attack is required before a field-separation claim."
    history:
      - date: 2026-08-27
        from: ACTIVE
        to: UNCHANGED
        reason: "Status vocabulary normalized; current corpus could not support the field-separation claim."
      - date: 2026-08-27
        from: UNCHANGED
        to: REDEFINED
