claims:
  - id: SOF-01
    statement: "在 repeated human-human drawing reference game 中，visual resemblance 与 interaction history 共同约束 pictorial meaning，且互动形成的表达仍保留 diagnostic visual features。"
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence: [c6-visual-resemblance-interaction-history]
    boundary: "单一 object category 的 controlled human drawing；yoked-vs-shuffled 主要隔离 same-producer sequence exposure，不识别 mutual common ground、original-dyad partner specificity、embodied AI 或 long-term transfer。"
    cumulative_change: STILL_HOLDS
  - id: SOF-02
    statement: "在受限 repeated reference games 中，artificial communicator 可通过 continual adaptation 或 success×cost post-training 获得更高的 communicative success 与 efficiency。"
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence: [e3-continual-adaptation-machine-communication, x8-success-cost-convention-formation]
    boundary: "E3 的主要 human evidence 是 fixed visual-reference contexts 中 one-sided adaptive listening；无 online non-adaptive control、partner swap、reciprocal repair 或 embodiment。"
    cumulative_change: STRENGTHENED
  - id: SOF-03
    statement: "Controlled human-robot visual reference tasks 能产生稳定的 task-specific linguistic conventions，但其效率轨迹与 human-human interaction 不完全相同。"
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence: [x1-spotter-human-robot-conventions]
    boundary: "受控 Dutch pilots 与 verbal referring expressions 不证明开放式、跨模态或长期 convention。"
    cumulative_change: PARTIALLY_ADDRESSED
  - id: SOF-04
    statement: "Current LVLM convention/grounding behavior is interaction-regime dependent：post-trained one-way 或 same-model dyads 可出现 convention-like efficiency/signatures，但 mixed human–AI、history-severed pseudo-dyads 与更复杂 role-asymmetric tasks 暴露可靠性和 partner-specificity 缺口。"
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence: [x2-lvlms-humans-ground-differently, x8-success-cost-convention-formation, x9-aligned-not-partner-specific, x10-llms-people-conventions]
    boundary: "不同研究使用不同 training objective、角色结构、模型和任务；它们不构成单一总体效应，也不能外推所有 LVLM。"
    cumulative_change: REDEFINED
  - id: SOF-05
    statement: "一个 AR collaboration prototype 表明 first-person perspective、gaze、gesture 与 revisable memory 可以组合为 history-aware interaction infrastructure。"
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence: [x3-seeing-eye-to-eye]
    boundary: "System memory 不等于 mutual belief 或 jointly negotiated convention。"
    cumulative_change: NO_LONGER_CLAIMABLE
  - id: SOF-06
    statement: "History-aware memory、partner adaptation、task success、lexical alignment、world-model alignment、positive evidence、mutual belief 与 shared convention 需要不同 evidence standards。"
    claim_kind: agent_synthesis
    status: OPEN
    evidence_strength: MODERATE
    evidence: [c1-referring-as-collaborative-process, c2-grounding-in-communication, c3-conceptual-pacts, c4-repeated-reference-games, c6-visual-resemblance-interaction-history, c8-gesturing-toward-abstraction, d5-legibility-and-predictability, e2-human-robot-mutual-adaptation, e3-continual-adaptation-machine-communication, x7-embodied-world-model-alignment, x9-aligned-not-partner-specific, x11-common-ground-benchmark]
    boundary: "跨论文 agent synthesis；C5/C6 属同一 empirical lineage，success、shortening 或 alignment 任何单项都不是 convention 的充分证据。"
    cumulative_change: STRENGTHENED
  - id: SOF-07
    statement: "Human convention theory already models partner-specific common ground and its transfer toward population-level conventions; partner-specific origin and subsequent transfer are complementary, not mutually exclusive."
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence: [x12-partners-to-populations]
    boundary: "CHAI evidence concerns human linguistic coordination and simulation; it does not solve online embodied human–AI convention inference."
    cumulative_change: NEW_CORE

  - id: SOF-08
    statement: "在受控 human–human repeated verbal reference tasks 中，reference 通过 presentation、positive evidence、repair 与 partner-specific history 形成；随后压缩稳定，partner change 可触发 elaboration 或回退到更通用表达。"
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence: [c1-referring-as-collaborative-process, c3-conceptual-pacts]
    boundary: "小样本 spoken laboratory reference tasks；不是 multimodal、longitudinal 或 embodied-AI evidence。"
    cumulative_change: NEW
  - id: SOF-09
    statement: "RSA 为 context-sensitive production/interpretation 提供 formal tools，且已有 adaptation/convention extensions；但 basic/full-utterance RSA 与 incremental、multimodal、mutually grounded interaction 之间仍有 validation gap。"
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence: [b1-pragmatic-language-interpretation, b2-rational-speech-act-framework]
    boundary: "Narrative framework reviews and heterogeneous modeling tasks do not establish one cognitive process or embodied-agent capability."
    cumulative_change: NEW
  - id: SOF-10
    statement: "在受控 one-shot human drawing reference games 中，communicators 会按 distractor similarity 在 diagnosticity 与 production cost 间调节视觉细节。"
    claim_kind: source_says
    status: EMERGING
    evidence_strength: MODERATE
    evidence: [b3-pragmatic-inference-visual-abstraction]
    boundary: "32 objects/4 categories，prototype-choice model；无 repeated history、partner-specificity 或 embodiment。"
    cumulative_change: NEW
  - id: SOF-11
    statement: "在受控 repeated human text reference games 中，labels 的缩短受 listener feedback 与 local discriminability 影响，并表现 within-dyad stabilization 与 between-dyad divergence。"
    claim_kind: source_says
    status: EMERGING
    evidence_strength: MODERATE
    evidence: [c4-repeated-reference-games]
    boundary: "Text Tangram task、六 repetitions；dialogue 被 collapse，且无 partner swap/history ablation。"
    cumulative_change: NEW
  - id: SOF-12
    statement: "在一项受控 online human assembly task 中，重复协作伴随更短、更多 tower-level referring expressions；combined library-learning/pragmatic model 可定性再现该 shift。"
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
