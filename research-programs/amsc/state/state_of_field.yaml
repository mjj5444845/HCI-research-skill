    evidence: [c3-conceptual-pacts, c4-repeated-reference-games, c5-graphical-convention-formation, c6-visual-resemblance-interaction-history, c7-shared-procedural-abstractions, c8-gesturing-toward-abstraction, e3-continual-adaptation-machine-communication]
