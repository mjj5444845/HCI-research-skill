    status: EMERGING
    evidence_strength: MODERATE
    evidence: [d5-legibility-and-predictability]
    boundary: "Video、two-goal、hand-designed trajectories；HERB cost-model mismatch、human post-hoc inconsistency，且无 long-term interaction。"
    cumulative_change: NEW
  - id: SOF-15
    statement: "Designer-authored robot movement and gaze can each convey instrumental intent/reference and relational or affective social meaning; functions are not cleanly separable by modality."
