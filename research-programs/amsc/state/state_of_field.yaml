    boundary: "未直接测量 shared internal abstractions；Builder 无语言反馈，模型假设 shared DSL 与同步学习。"
    cumulative_change: NEW
  - id: SOF-13
    statement: "在 controlled repeated human–human physical assembly 中，dyads 提高 accuracy/efficiency，并复用 speech/gesture abstractions；modality allocation 与 vocabulary across dyads diverge。"
