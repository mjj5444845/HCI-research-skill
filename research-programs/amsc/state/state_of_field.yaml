    statement: "Artificial communicator 可在 repeated linguistic reference interaction 中进行 partner adaptation，并提高摘要所报告的准确性与效率。"
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence: [e3-continual-adaptation-machine-communication]
    boundary: "当前页面只完成摘要调查，且证据不覆盖 multimodal embodied convention。"
