version: "2.1"
updated_at: 2026-09-18
evidence_snapshot:
  total_papers: 48
  warning: 既有42篇保留原审查，2026-09-18补回6篇正文普通审查；未复现实验，不代表研究者已阅读。
  by_investigation_status:
    full_paper_investigation: 23
    radar_full_text_audit: 24
    abstract_evidence_investigation: 1
claims:
  - id: SOF-01
    statement: 在 repeated human-human drawing reference game 中，visual resemblance 与 interaction history 共同约束
      pictorial meaning，且互动形成的表达仍保留 diagnostic visual features。
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - c6-visual-resemblance-interaction-history
    boundary: 单一 object category 的 controlled human drawing；yoked-vs-shuffled 主要隔离 same-producer sequence
      exposure，不识别 mutual common ground、original-dyad partner specificity、embodied AI 或 long-term
      transfer。
    cumulative_change: STILL_HOLDS
  - id: SOF-02
    statement: 在受限 repeated reference games 中，artificial communicator 可通过 continual adaptation 或 success×cost
      post-training 获得更高的 communicative success 与 efficiency。
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - e3-continual-adaptation-machine-communication
      - x8-success-cost-convention-formation
    boundary: E3 的主要 human evidence 是 fixed visual-reference contexts 中 one-sided adaptive listening；无 online
      non-adaptive control、partner swap、reciprocal repair 或 embodiment。
    cumulative_change: STRENGTHENED
  - id: SOF-03
    statement: Controlled human-robot visual reference tasks 能产生稳定的 task-specific linguistic
      conventions，但其效率轨迹与 human-human interaction 不完全相同。
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x1-spotter-human-robot-conventions
    boundary: 受控 Dutch pilots 与 verbal referring expressions 不证明开放式、跨模态或长期 convention。
    cumulative_change: PARTIALLY_ADDRESSED
  - id: SOF-04
    statement: Current LVLM convention/grounding behavior is interaction-regime dependent：post-trained
      one-way 或 same-model dyads 可出现 convention-like efficiency/signatures，但 mixed
      human–AI、history-severed pseudo-dyads 与更复杂 role-asymmetric tasks 暴露可靠性和 partner-specificity 缺口。
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x2-lvlms-humans-ground-differently
      - x8-success-cost-convention-formation
      - x9-aligned-not-partner-specific
      - x10-llms-people-conventions
    boundary: 不同研究使用不同 training objective、角色结构、模型和任务；它们不构成单一总体效应，也不能外推所有 LVLM。
    cumulative_change: REDEFINED
  - id: SOF-05
    statement: Eye2Eye整套AR系统减少错误和澄清需求；正文不支持显著缩短任务时间，组件混杂也不允许把收益单独归因于共享记忆。
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x3-seeing-eye-to-eye
    boundary: 短期整套系统收益；没有history severing、partner swap、角色互换或新表达协商。对象卡表示不等于双方确认的共同信念。
      消融同时改变memory/reflection和trigger，无法识别memory单独因果贡献。
    cumulative_change: NO_LONGER_CLAIMABLE
  - id: SOF-07
    statement: Human convention theory already models partner-specific common ground and its transfer toward
      population-level conventions; partner-specific origin and subsequent transfer are complementary,
      not mutually exclusive.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x12-partners-to-populations
    boundary: CHAI evidence concerns human linguistic coordination and simulation; it does not solve online
      embodied human–AI convention inference.
    cumulative_change: NEW_CORE
  - id: SOF-08
    statement: 在受控 human–human repeated verbal reference tasks 中，reference 通过 presentation、positive
      evidence、repair 与 partner-specific history 形成；随后压缩稳定，partner change 可触发 elaboration 或回退到更通用表达。
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - c1-referring-as-collaborative-process
      - c3-conceptual-pacts
    boundary: 小样本 spoken laboratory reference tasks；不是 multimodal、longitudinal 或 embodied-AI evidence。
    cumulative_change: NEW
  - id: SOF-09
    statement: RSA 为 context-sensitive production/interpretation 提供 formal tools，且已有 adaptation/convention
      extensions；但 basic/full-utterance RSA 与 incremental、multimodal、mutually grounded interaction 之间仍有
      validation gap。
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - b1-pragmatic-language-interpretation
      - b2-rational-speech-act-framework
    boundary: Narrative framework reviews and heterogeneous modeling tasks do not establish one cognitive
      process or embodied-agent capability.
    cumulative_change: NEW
  - id: SOF-10
    statement: 在受控 one-shot human drawing reference games 中，communicators 会按 distractor similarity 在
      diagnosticity 与 production cost 间调节视觉细节。
    claim_kind: source_says
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - b3-pragmatic-inference-visual-abstraction
    boundary: 32 objects/4 categories，prototype-choice model；无 repeated history、partner-specificity 或 embodiment。
    cumulative_change: NEW
  - id: SOF-11
    statement: 在受控 repeated human text reference games 中，labels 的缩短受 listener feedback 与 local
      discriminability 影响，并表现 within-dyad stabilization 与 between-dyad divergence。
    claim_kind: source_says
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - c4-repeated-reference-games
    boundary: Text Tangram task、六 repetitions；dialogue 被 collapse，且无 partner swap/history ablation。
    cumulative_change: NEW
  - id: SOF-12
    statement: 在一项受控 online human assembly task 中，重复协作伴随更短、更多 tower-level referring expressions；combined
      library-learning/pragmatic model 可定性再现该 shift。
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - c7-shared-procedural-abstractions
    boundary: 未直接测量 shared internal abstractions；Builder 无语言反馈，模型假设 shared DSL 与同步学习。
    cumulative_change: NEW
  - id: SOF-13
    statement: 在 controlled repeated human–human physical assembly 中，dyads 提高 accuracy/efficiency，并复用
      speech/gesture abstractions；modality allocation 与 vocabulary across dyads diverge。
    claim_kind: source_says
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - c8-gesturing-toward-abstraction
    boundary: 20 dyads、3 towers、4 repetitions、fixed roles；无 Agent、history-severing、repair perturbation 或 transfer。
    cumulative_change: NEW_CORE
  - id: SOF-18
    statement: Textual paralanguage provides five broad categories and is frequently observed in sampled
      2010s social-media posts, with platform-dependent distributions and context-dependent meaning.
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - a2-textual-paralanguage
    boundary: Descriptive convenience samples, coder inconsistency/no reliability statistic, and no causal
      evidence for warmth, rapport or trust.
    cumulative_change: NEW
  - id: SOF-19
    statement: Modality presence, grammatical structure and semantic dominance offer a usable theoretical
      lens for verbal, bodily and graphic multimodal interaction.
    claim_kind: theoretical_lens
    status: CONTESTED
    evidence_strength: PRELIMINARY
    evidence:
      - a5-multimodal-parallel-architecture
    boundary: Single static architecture with underspecified component mechanisms; illustrative coding does
      not validate cognitive truth.
    cumulative_change: NEW
  - id: SOF-20
    statement: same-producer exposure、style familiarity、independent task learning 与 mutually grounded
      convention remain causally under-separated across much of the audited multimodal convention
      evidence.
    claim_kind: agent_synthesis
    status: OPEN
    evidence_strength: MODERATE
    evidence:
      - c3-conceptual-pacts
      - c4-repeated-reference-games
      - c5-graphical-convention-formation
      - c6-visual-resemblance-interaction-history
      - c7-shared-procedural-abstractions
      - c8-gesturing-toward-abstraction
      - e3-continual-adaptation-machine-communication
      - x20-passing-the-pact
      - x22-banana-man-pragmatic-interpretation
    boundary: Cross-paper causal audit, not any paper original claim; C5 and C6 count as one empirical
      lineage. X20 is abstract-only; X22 studies naïve interpreters of archived human games, not
      reciprocal dyads.
    cumulative_change: NEW_CORE
  - id: SOF-21
    statement: Contextualized emoji、visual lexicon、dyadic action scaffolds 与 graded reference models
      共同表明：signal form 本身不足以决定 meaning；local context、task discriminability、relationship 与 interaction
      history 会改变解释和表达成本。
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - a3-interpreting-emoji-pragmatics
      - a4-a-visual-lexicon
      - a6-puppetchat
      - b4-when-redundancy-is-useful
    boundary: 证据横跨第三方 emoji interpretation、理论 visual lexicon、11 个 close dyads 的短期 deployment 与 verbal
      reference games；不能合并为单一 causal mechanism，也不是 embodied human–AI convention evidence。
    cumulative_change: STRENGTHENED
  - id: SOF-24
    statement: "LLM naming-game convergence can be a false-positive mechanism claim: a shared pretrained
      label prior and apparatus presentation can accelerate or determine convergence, while per-agent
      label-pool permutation reveals slower interaction-driven negotiation."
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x13-silica-agent-societies
    boundary: Single-author preprint using artificial agent populations; shuffled agents still share
      pretrained label semantics, and results do not establish human-equivalent convention.
    cumulative_change: NEW
  - id: SOF-27
    statement: Long-term conversational memory availability and elicited retrieval are empirically distinct
      from naturally integrating relevant shared history during interaction.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x16-memuse-natural-integration
    boundary: One text-only deployment; Natural Integration–satisfaction association is observational and
      based on 48 sessions/16 users, not evidence of mutual belief or convention.
    cumulative_change: STRENGTHENED
  - id: SOF-28
    statement: Under character pressure, explicitly prompted AI–AI postmortem coordination can produce
      efficient dyad-specific shorthand, partial productivity, clarification behavior, and limited
      newcomer uptake.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x17-glossogen-emergent-language
    boundary: Agents were told to develop shorthand, postmortems allowed free code definition, linguistic
      analysis partly used LLM judges, and one replacement generation does not establish cumulative
      cultural evolution or human-like common ground.
    cumulative_change: NEW
  - id: SOF-31
    statement: Abstract-level evidence from one multiparty Tangram task reports that speakers reuse prior
      conceptual pacts with less-knowledgeable human and agent interlocutors while showing stronger
      knowledge-sensitive elaboration in human–human communication; pact reuse and audience design
      therefore require separate measurement.
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x20-passing-the-pact
    boundary: Sample, agent implementation, knowledge manipulation, coding reliability, effect sizes and
      analysis remain unavailable; the observed speaker behavior does not establish agent learning,
      mutual belief, equivalence or shared-history causality.
    cumulative_change: NEW
  - id: SOF-32
    statement: In a purposefully sampled 4,735-item Chinese-language social-pragmatics benchmark, removing
      reconstructed interaction context reduced tested-model mean accuracy by 39.07 percentage points,
      demonstrating task-specific situated-context dependence.
    claim_kind: source_says
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x21-social-pragmatic-chinese-comments
    boundary: Selection conditioned on context dependence; a 343-item revised hard subset had only 64.14%
      human accuracy and kappa .53. This is not evidence about Chinese culture, prevalence, original
      speaker intent, dyadic grounding or embodiment.
    cumulative_change: NEW
  - id: SOF-33
    statement: In archived iterated Tangram games, tested VLMs could exploit externally supplied correct
      game-specific mappings but struggled to accumulate relevant context or recover from their own
      errors under limited feedback, separating convention retrieval from endogenous construction and
      repair.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x22-banana-man-pragmatic-interpretation
    boundary: Models were naïve interpreters of human dialogue rather than reciprocal partners; the result is
      task/model specific and does not prove general incapacity to form conventions.
    cumulative_change: NEW_CORE
  - id: SOF-34
    statement: On 200 IndiRef questions over human situated-dialogue traces, incremental image/text
      externalization outperformed full-dialog reasoning with the same VLM, and hybrid artifacts best
      preserved complementary depictable and propositional state.
    claim_kind: source_says
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x23-machine-mental-imagery-common-ground
    boundary: Single benchmark and LLM judge; the pipeline still missed negation, indirect requests and
      cross-frame relations. A system-side state representation is not evidence of mutually established
      common ground.
    cumulative_change: NEW
  - id: SOF-35
    statement: Conversation-Analysis-grounded visual features improved other-initiated-repair detection and
      type classification beyond text plus audio across two human dyadic corpora, with the size and kind
      of benefit differing by interaction setting.
    claim_kind: source_says
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x24-multimodal-repair-detection
    boundary: Human–human French and Dutch corpora, only 47 OIR cases in NOXI, and no real-time agent
      response or repair outcome; detecting trouble is not performing successful grounding repair.
    cumulative_change: NEW
  - id: SOF-36
    statement: Some VLMs conflate available task content with established referential alignment in MapTask
      overhearer judgments.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x25-seeing-is-not-sharing
    boundary: Model-specific responses; one corpus and no interactive grounding.
    cumulative_change: NEW
  - id: SOF-37
    statement: A literal-posterior residual measures beyond-literal Hanabi cooperation but does not identify
      jointly formed conventions.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x26-convention-gap
    boundary: Retrospective measurement; unilateral adaptation and shared convention remain separable hypotheses.
    cumulative_change: NEW
  - id: SOF-38
    statement: English Dixit clue coding provides a method for examining useful ambiguity and cultural allusion.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x27-calibrated-ambiguity
    boundary: Asymmetric card/decoy selection, author coders, no cross-cultural or live recipient validation.
    cumulative_change: NEW
  - id: SOF-39
    statement: In-turn content uptake is distinguishable from unchanged continuation and yielding.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x28-continue-adapt-yield
    boundary: Outcome-informed cue labels and conditional coverage preclude an unbiased general human–model gap.
    cumulative_change: NEW
  - id: SOF-40
    statement: Role-matched swaps provide intervention evidence that formed notebook-equipped LLM dyads are
      not fully interchangeable in coordination cost.
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x29-testing-interchangeability
    boundary: Formation-order/task-note differences remain; four swap pairs per setting, no human partners or
      mutual-meaning test; recovery arithmetic requires clarification.
    cumulative_change: REDEFINED
  - id: SOF-41
    statement: 视觉语用评估已存在直接方法先例：RefOI中自动指标与人的指称定位不能互换，CMPM中原序展示高分不能证明打乱后的顺序恢复。
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: MODERATE
    evidence:
      - x30-refoi-pragmatic-generation
      - x31-cmpm-order-matters
    boundary: 不同任务的结果不能合成同一能力分数；CMPM为预印本、小规模解释评价。
    cumulative_change: REDEFINED
  - id: SOF-42
    statement: 花字沟通系统、文化meme理解资源和meme语用建模已有实质先例；新主线的研究空间需要在具体机制、模型能力或评价效度上定位。
    claim_kind: source_grounded_synthesis
    status: EMERGING
    evidence_strength: PRELIMINARY
    evidence:
      - x32-intent-projection
      - x33-speechcap
      - x34-memebridge
      - x35-mgmc-fusion
    boundary: 综合不构成新颖性结论，也不证明这些方法解决真实互动中的理解；各研究样本、任务和证据不同。
    cumulative_change: REDEFINED
claim_statuses:
