    exam_theme: 5
    rq: "能否用可更新的人类 adaptability model 规划 robot actions，使 team 收敛到较优策略并保持 trust？"
    theory: ["Bounded-Memory Adaptation Model", "MOMDP", "bounded rationality", "planning under uncertainty", "latent human adaptability"]
    method: "MTurk video/UI collaborative table-carrying tasks，而非实体 co-manipulation。主要 between-subject study n=69，后续 repeated task n=43、hallway validation n=65、cross-task transfer n=58；离散 goals/actions，k=3 history，alpha grid，SARSOP planning；测 strategy choice、trust 与 team perceptions。"
    finding: "Mutual 相比 Fixed trust 更高 U=180,p=.048，但 satisfaction 并非全面显著；57% Mutual participants 转向 robot optimal strategy vs Cross-training 26%。 k=1 pilot 约 23% oscillation，k=3 更符合 observations；initial trust 与 low self-confidence 预测首次 adaptation。 cross-task transfer 不完整，说明 task/social norm matter。"
    limitation: "web/video UI、离散 designer-defined goals/modes；alpha 更像 compliance/strategy switching 而非 reciprocal co-learning。无 communicative meaning、repair、mutual belief 或 convention。"
