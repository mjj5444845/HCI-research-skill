    finding: "repeated objects 的 efficiency/accuracy improvement 大于 controls；yoked recognition improvement 大于 shuffled，stroke count 下降。 drawings 偏离各自初始形式、within interaction 更一致，并在不同 interactions 间适度分化。"
    limitation: "yoked observers 不是原 partner；manipulation 隔离的是 same-producer sequence continuity，不是 reciprocal common ground。单一 chair category、固定角色，部分结果在 C6 replication 中修正。"
