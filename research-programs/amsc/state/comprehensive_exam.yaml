  - id: C6
    citation: Robert D. Hawkins, Megumi Sano, Noah D. Goodman, Judith E. Fan (2023). Visual Resemblance and
      Interaction History Jointly Constrain Pictorial Meaning. Nature Communications, 14, Article 2199
    source_url: https://www.nature.com/articles/s41467-023-37737-w
    exam_theme: 3
    rq: 如何分离 task practice、item repetition、same-producer history 与 diagnostic visual content，并检验 resemblance
      和 history 如何联合约束 meaning？
    theory:
      - icon–symbol continuum
      - visual resemblance
      - graphical convention
      - interaction history
    method: 主 communication study 138 participants/69 dyads；internal replication 130/66 dyads。4 repeated
      ShapeNet chairs×8 与 4 controls；recognition 主样本 223、replication 225，比较 yoked same-producer sequences
      与 shuffled；VGG-19 analyses，443 annotators 映射 strokes，117 annotators 提供 diagnosticity heatmaps。
    finding: communication efficiency/accuracy 提高且 repeated>control；within-dyad drawings 稳定、between-dyad 同物
      drawings 分歧；yoked sequence improvement > shuffled，replication 排除 viewer interrupt confound。
      repeated drawings 变稀疏，但相对 controls 更集中于 object-diagnostic regions，反驳纯 arbitrary-symbol reading。
    limitation: yoked-vs-shuffled 仍主要操作 same-producer exposure，不是在原 dyad 做 partner swap；style familiarity
      可能是机制之一。单一 chairs、fixed roles、AMT 与 post-hoc exclusions 限制泛化。
    relation_to_mainline: "Stages: Grounding / Common Ground → Convention Formation; mechanisms: Meaning,
