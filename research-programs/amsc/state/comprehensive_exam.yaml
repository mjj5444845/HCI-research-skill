    finding: "该文没有新的单一实验 finding；其综合主张是 grounding technique 随 purpose 与 medium 改变。 medium 的 copresence、visibility、audibility、cotemporality、simultaneity、sequentiality、reviewability 与 revisability 会改变 formulation、reception、delay、fault 与 repair 成本。"
