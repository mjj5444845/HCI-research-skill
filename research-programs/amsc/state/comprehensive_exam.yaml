  - id: C2
    citation: Herbert H. Clark, Susan E. Brennan (1991). Grounding in Communication. Perspectives on Socially
      Shared Cognition, 127–149
    source_url: https://www.cs.cmu.edu/~illah/CLASSDOCS/Clark91.pdf
    exam_theme: 3
    rq: 如何统一描述 contribution、evidence of understanding、grounding criterion，以及 purpose/medium 对 grounding
      techniques 的约束？
    theory:
      - common ground
      - grounding criterion
      - presentation plus acceptance
      - positive evidence
      - principle of least collaborative effort
      - medium constraints
    method: 理论/概念综合，使用自然会话例子与既有 face-to-face、telephone、keyboard、email 研究；没有新招募样本或原创实验。
    finding: 该文没有新的单一实验 finding；其综合主张是 grounding technique 随 purpose 与 medium 改变。 medium 的
      copresence、visibility、audibility、cotemporality、simultaneity、sequentiality、reviewability 与
      revisability 会改变 formulation、reception、delay、fault 与 repair 成本。
    limitation: mutual belief 难以直接观测；框架依赖 cooperative coordination，媒介 taxonomy 源自 1991 年 ecology，且无 embodied
      AI 或 causal comparison。
    relation_to_mainline: "Stages: Grounding / Common Ground → Situated Adaptive Communication; mechanisms:
      Grounding, Situated multimodal communication"
    gap_supported_challenged:
      - GAP-03
      - GAP-04
