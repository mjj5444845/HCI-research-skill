  - id: B3
    citation: Judith E. Fan, Robert D. Hawkins, Mike Wu, Noah D. Goodman (2020). Pragmatic Inference and
      Visual Abstraction Enable Contextual Flexibility During Visual Communication. Computational Brain &
      Behavior, 3(1), 86–101
    source_url: https://cogtoolslab.github.io/pdf/fan_cbb_2019.pdf
    exam_theme: 2
    rq: 能否用 algorithmically explicit account 联结 visual abstraction、pragmatic diagnosticity 与 production
      cost，并检验 context、cost、visual features 是否都必要？
    theory:
      - Gricean informativeness
      - Rational Speech Act
      - decision-theoretic utility
      - visual abstraction as context-relative diagnosticity
    method: 192 AMT participants/96 pairs 完成 online drawing reference game，32 objects/4 categories，close vs
      far distractors；另 112 人做 naive recognition。human recognition 与 VGG-19 features 进入 probabilistic
      sketcher model，使用 5-fold CV 与 Bayes-factor lesion comparisons。
    finding: viewer overall accuracy 93.8%；far context 以更少 time/strokes/ink 达到近 ceiling，close sketches 的
      out-of-context recognition 为 54.2% vs far 37.5%。 full human-recognition model 优于 no-context 与
      no-cost lesions；high-level visual features 优于 mid/low features。
    limitation: 模型只在参与者已生成的 prototype sketch categories 中选择，不生成 strokes；visual encoder 需 supervision，drawing
      time 只是 cost proxy；无 repeated history/convention manipulation。
    relation_to_mainline: "Stages: Social Meaning / Pragmatics → Grounding / Common Ground; mechanisms: Meaning, Grounding"
