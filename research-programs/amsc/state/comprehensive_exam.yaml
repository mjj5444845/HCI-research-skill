    finding: "早期 long-term HRI 多 exploratory、小样本；novelty 后应按 function 定义 long term，而非固定天数。 continuity/routines、past-activity memory、new behaviors、affect response、identification 与 personalization 被反复提出；应分析 multi-session trajectories，而非只比较 first/last。 文中 memory/adaptation nearly unexplored 仅描述 2013 corpus，不能当作 2026 current-state claim。"
