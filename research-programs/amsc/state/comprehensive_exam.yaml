  - id: C3
    citation: "Susan E. Brennan, Herbert H. Clark (1996). Conceptual Pacts and Lexical Choice in Conversation. Journal of Experimental Psychology: Learning, Memory, and Cognition, 22(6), 1482–1493"
    source_url: "https://web.stanford.edu/~clark/1990s/Brennan%2C%20S.E.%20_%20Clark%2C%20H.H.%20_Conceptual%20pacts%20and%20lexical%20choice%20in%20conversation_%201996.pdf"
    exam_theme: 3
    rq: "lexical reuse 是否由当前 informativeness、frequency/recency history、provisionality 与 partner identity 共同决定？"
    theory: ["conceptual pact", "lexical entrainment", "partner-specific precedent", "provisionality and hedging"]
    method: "三个 human picture-card matching experiments：Exp1 48 students/24 pairs；Exp2 72/36 pairs 并交替角色；Exp3 50 students，比较 10 same-partner 与 10 switch-partner groups。测 lexical/verbatim equivalence、basic-level terms 与 hedging。"
    finding: "frequency 加 recency 比 recency 或当前 informativeness 更好解释 lexical reuse；谁最初提出 conceptualization 不决定后续 entrainment。 uncertainty 较高时 hedging 更多，随 grounding 增强而消失。 Exp3 同一 terms 的 B4→C1 保留为 same partner 48% vs switch partner 18%；关键 item-level test 仅 marginal，p=.08，switch condition 也更常回退至 basic-level terms。"
    limitation: "只有四个关键 target items，关键 partner effect 的 item-level test marginal；partner switch 同时改变 memory cue、feedback 与 expectations，不能单独识别内部 representation。"
    relation_to_mainline: "Stages: Grounding / Common Ground → Convention Formation → Personalization / Co-adaptation; mechanisms: Grounding, Convention, Adaptation"
