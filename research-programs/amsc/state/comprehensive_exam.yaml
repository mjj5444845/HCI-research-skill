  - id: C7
    citation: "William P. McCarthy, Robert D. Hawkins, Haoliang Wang, Cameron Holdaway, Judith E. Fan (2021). Learning to Communicate about Shared Procedural Abstractions. Proceedings of the 43rd Annual Meeting of the Cognitive Science Society, 77–83"
    source_url: "https://repositories.cdlib.org/uc/item/3vs8285x"
    exam_theme: 3
    rq: "lexical mappings 与 hierarchical procedural abstractions 能否在 repeated physical assembly 中共同形成？"
    theory: ["Bayesian program and library learning", "minimum description length", "RSA-like lexical inference", "efficiency–informativity trade-off"]
    method: "98 AMT participants/49 architect–builder dyads 完成 12 online block-assembly trials，3 towers×4 repetitions；Architect 发送不超过 100 字符的 stepwise messages，Builder 不可回话。测 F1、words/messages、block-vs-tower references、JSD；DSL/library learner 做定性 simulation。"
    finding: "初始 F1=.876 并继续提高，words/messages 下降；language 从 block-level 转向 tower-level terms，dyads 的 lexical solutions 分化。 library learner 可发现 tower fragments，并在中等 cost 下定性再现 abstraction shift。"
    limitation: "shared procedural abstraction 未直接测量；Builder 无语言反馈，model 假设双方同速学习同一 DSL，未 fit individual trajectories；coding 无 reliability，初始 high accuracy 弱化 necessity claim。"
    relation_to_mainline: "Stages: Grounding / Common Ground → Convention Formation → Situated Adaptive Communication; mechanisms: Grounding, Convention, Embodied Communication"
