reading_matrix:
  - id: C1
    citation: Herbert H. Clark, Deanna Wilkes-Gibbs (1986). Referring as a Collaborative Process. Cognition,
      22(1), 1–39
    source_url: https://web.stanford.edu/~clark/1980s/Clark%2C%20H.H.%20_%20Wilkes-Gibbs%2C%20D.%20_Referring%20as%20a%20collaborative%20process_%201986.pdf
    exam_theme: 3
    rq: speaker 与 addressee 如何协作完成 reference，并以当前目的所需的充分理解为 grounding criterion？
    theory:
      - collaborative model
      - presentation–acceptance cycle
      - mutual responsibility
      - principle of least collaborative effort
    method: 8 对 Stanford undergraduate dyads 在 opaque screen 两侧完成 12 个 Tangram 排列任务，共 6 trials；固定
      director/matcher，可自由交谈；分析 576 placements、9,792 transcript words 及 exchange/repair/acceptance 结构。
    finding: 每图 director words 从 trial 1 约 41 降至 trial 6 约 8，director turns 从约 3.7 降至约 1。 basic exchanges 从早期
      18% 升至后期约 84%；reference 常经 presentation、verdict、repair/expansion/replacement 的递归 acceptance cycle。
    limitation: 仅 8 对学生、单一 spoken Tangram task、固定角色；无 partner swap、history ablation、非语言或具身条件，表达缩短本身不足以证明
      partner-specific convention。
    relation_to_mainline: "Stages: Grounding / Common Ground → Convention Formation; mechanisms: Meaning,
      Grounding, Convention"
    gap_supported_challenged:
      - GAP-01
      - GAP-02
      - GAP-03
      - GAP-04
