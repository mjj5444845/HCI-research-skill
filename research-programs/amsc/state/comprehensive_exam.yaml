  - id: C8
    citation: "Kiyosu Maeda, William P. McCarthy, Ching-Yi Tsai, Jeffrey Mu, Haoliang Wang, Robert D. Hawkins, Judith E. Fan, Parastoo Abtahi (2026). Gesturing Toward Abstraction: Multimodal Convention Formation in Collaborative Physical Tasks. CHI 2026"
    source_url: "https://arxiv.org/abs/2602.08914"
    exam_theme: 3
    rq: "How do multimodal signals, procedural abstractions, and modality allocation evolve across repeated collaborative physical tasks, and can a multimodal pragmatic model reproduce those dynamics?"
    theory: ["ad-hoc convention", "common ground", "procedural abstraction and chunking", "multimodal redundancy and complementarity", "multimodal RSA"]
    method: "Study 1 recruited 146 MTurkers/73 dyads; after exclusions 98 people/49 dyads completed 3 tower pairs×4 text repetitions. Study 2 used 40 people/20 dyads in separated Meta Quest 3 AR rooms with speech and 24-joint hand keypoints across 12 physical LEGO trials. Mixed models, permutation tests, coded speech/gesture, and a DSL plus multimodal RSA simulation were used."
    finding: "Online task F1 rose .88→.98 while words/messages declined; block references fell 7.3→3.6 and tower references rose .6→1.1; between-dyad vocabulary divergence increased. Lab success rose 74.03%→98.36%; instruction/build time fell, tower abstractions appeared earlier, gestural abstractions were already present from round 1, and later redundancy often marked changed position/orientation. A fitted simulation descriptively reproduced shorter instructions and modality shifts."
    limitation: "human–human only；无 partner swap/pseudo-dyad/history ablation、role reversal、controlled breakdown/repair 或 transfer。小 tower domain、four repetitions、fixed roles，模型部分参数 in-sample fitted 且假设 perfect alignment/uniform priors。"
