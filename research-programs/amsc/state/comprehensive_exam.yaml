  - id: C5
    citation: Robert X. D. Hawkins, Megumi Sano, Noah D. Goodman, Judith E. Fan (2019). Disentangling
      contributions of visual information and interaction history in the formation of graphical
      conventions. Proceedings of the 41st Annual Meeting of the Cognitive Science Society
    source_url: https://escholarship.org/uc/item/6408z76h
    exam_theme: 3
    rq: 重复绘图是否产生 object-/interaction-specific efficiency，same-producer history sequence 是否优于 shuffled
      sequence，drawings 是否 within-pair 稳定并 across-pair 分化？
    theory:
      - graphical convention
      - experimental semiotics
      - visual resemblance
      - socially mediated history
    method: 138 AMT participants/69 dyads，固定 sketcher/viewer；4 repeated ShapeNet chairs×8 次、4 control chairs
      pre/post。245 naive recognizers，223 retained，比较 yoked same-sketcher sequence 与 shuffled
      sequence；mixed models、BIS 与 VGG-19 similarity。
    finding: repeated objects 的 efficiency/accuracy improvement 大于 controls；yoked recognition improvement 大于
      shuffled，stroke count 下降。 drawings 偏离各自初始形式、within interaction 更一致，并在不同 interactions 间适度分化。
    limitation: yoked observers 不是原 partner；manipulation 隔离的是 same-producer sequence continuity，不是 reciprocal
      common ground。单一 chair category、固定角色，部分结果在 C6 replication 中修正。
    relation_to_mainline: "Stages: Grounding / Common Ground → Convention Formation; mechanisms: Meaning,
