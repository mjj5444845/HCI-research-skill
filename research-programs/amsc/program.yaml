artifact_roadmap:
  title: 从已有表达研究，到可理解、可调整的机器人沟通
  status: APPROVED_DIRECTION
  approved_at: 2026-11-05
  first_question_id: null
  identity: 我研究如何设计机器人的视觉与具身表达，使具体的人能够理解其请求、状态和行动；这些表达如何根据个人、情境与互动历史调整，以及这种沟通如何影响持续互动中的期待、负担与关系。
  foundations: &a2
    - id: X33
      slug: x33-speechcap
      role: 导师的先行研究
      status: ADVISOR_PRIOR_WORK
      boundary: 支持人际交流的系统，不等于已经证明机器人理解、AR 实体部署或个性化效果。
    - id: X68
      slug: x68-manicule
      role: 用户已完成的研究
      status: COMPLETED_RESEARCH_REJECTED_USER_REPORTED
      boundary: 用户确认稿件被拒；原型与研究已经完成。固定顺序和多因素差异不支持媒介排名、元素因果或长期关系结论。
  stages:
    - id: expression
      title: 表达与理解
      question: 人从表达中读出什么，哪些含义必须明确？
      status: DRAFT
      contribution: Empirical 与 artifact 可共同出现
      deliverables:
        - 表达资源、理解与误解证据、设计原则。
      depends_on: []
    - id: creation
      title: 表达设计与执行
      question: 怎样把沟通意图变成可调整、可核查的表达？
      status: DRAFT
      contribution: Artifact、方法及能力评价
      deliverables:
        - 有限表达规格、原型或按真实需求发展的创作方法。
      depends_on: []
    - id: adaptation
      title: 面向具体人的适应
      question: 哪些差异需要个性化，谁决定怎样调整？
      status: DRAFT
      contribution: Empirical、artifact 与有证据的边界解释
      deliverables:
        - 表达详细度、请求持续性、共同简写或纠错等具体分支。
      depends_on: []
    - id: ongoing
      title: 持续互动中的后果
      question: 表达变化如何影响期待、负担、信任及相处方式？
      status: DRAFT
      contribution: Empirical，及潜在 theoretical contribution
      deliverables:
        - 真实重复使用的证据与跨研究解释。
      depends_on: []
  plan_source: research-programs/amsc/state/current_plan.json
design_space:
  architecture_status: OPEN
  alternatives:
    - distinct character per robot
    - one companion across multiple physical extensions
    - selectively expressive devices coordinated by a companion
    - multiple personas within one body
  non_requirements:
    - Every device can converse
    - Every robot has an independent virtual character
    - A face, humanoid body or LLM
    - All papers contain all contribution types
  character_dimensions:
    - persistent identity and commitments
    - context-sensitive expression
    - user preferences and habits
    - explicitly traceable evolution
    - capability-constrained physical behavior
