  exam_role: short_term_filtered_view
  exam_update_condition: Only when an upstream change directly affects an exam theme, anchor, writing claim, or oral question.
core_theory_priority: Question-dependent social perception, attribution, expectancy and relational-agent
  theories; social pragmatics and grounding remain useful resources, not mandatory framing.
