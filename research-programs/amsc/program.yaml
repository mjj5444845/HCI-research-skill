program_id: amsc
version: "3.0"
name: Expressive Robot Communication and AI Companions with Physical Extensions
research_identity: I study how to design visual and embodied expressions through which robots and AI
  companions communicate, how people interpret these expressions and character-consistent behavior, and how
  these interactions shape relationships over time, including companions that extend across robotic and
  electronic devices.
