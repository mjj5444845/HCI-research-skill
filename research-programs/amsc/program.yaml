  stages:
    - id: work-06
      number: "01"
      title: 表达何时传对意思、何时只提高确信？
      question: 同一视觉/动作线索在不同情境中，如何分别影响意图识别、判断确信及能力预期？
      artifact_name: 表达库与感知误差图
      artifact_kind: 候选研究artifact · 未实施
      status: PLANNED
      timing: 独立候选；不指定先后或工期
      contribution: Empirical / artifact可独立成立；potential theoretical contribution需要机制证据。
      interface_panels:
        - title: 条件与设计
          content: 先用多实例视频/动画操纵表达与情境；分别记录开放解释、识别准确度和确信，控制幅度、时长及任务成功。
        - title: 证据与限制
          content: 表达增加吸引力不等于准确理解；视频不能证明实体或关系效应。
      workflow:
        - 核对最近工作
        - 界定主张与对照
        - 验证操纵和测量
        - 按证据决定推进
      deliverables:
        - 表达库与感知误差图
        - 可复核协议、对照、失败边界
      evidence:
        - 先用多实例视频/动画操纵表达与情境；分别记录开放解释、识别准确度和确信，控制幅度、时长及任务成功。
        - 表达增加吸引力不等于准确理解；视频不能证明实体或关系效应。
      gate: 问题与证据匹配，pilot可区分竞争解释；由研究者决定是否立项。
      stop: 若仅重现已知偏好、操纵混杂或资源不支持，改题或暂缓。
