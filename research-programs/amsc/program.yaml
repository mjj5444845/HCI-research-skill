program_id: amsc
version: "3.1"
name: Robot Visual Expression, Personalized Communication and Ongoing Human–Robot Interaction
research_identity: I study how to design robots’ visual and embodied expressions so that people can understand
  their requests, states and actions; how these expressions adapt to individuals, contexts and interaction
  histories; and how this communication shapes expectations, burdens and relationships over time.
