enabled: true
schedule:
  timezone: America/New_York
  cron: 0 3 * * 1
  human_label: Every Monday at 03:00
lookback_days: 7
max_candidates: 100
deep_read_limit: 5
normal_read_limit: 10
interests:
  primary:
    - HRI
    - HCI
    - CSCW
    - AI
    - CV
    - NLP
    - Cognitive science
  semantic_descriptions:
    - robot visual and nonverbal expression; motion, timing, light, character and communicative function
    - user perception versus longitudinal human-robot relationships
    - character-personality and robot behavior consistency; persistence versus evolution
    - AI companions with physical extensions; migrating agents, cross embodiment identity and distributed
      agency
    - user habits, preferences, adaptation and controllable relational behavior
  exclusions:
    - pure application papers with no meaningful research contribution
    - AI wrapper papers with only obvious user preference outcomes
venues:
  prioritize: &a1
    - HRI
    - ACM THRI
    - RO-MAN
    - CHI
    - CSCW
    - UIST
    - ACL
    - EMNLP
    - NAACL
    - COLING
    - TACL
    - CVPR
    - ICCV
    - ECCV
    - NeurIPS
    - ICML
    - ICLR
    - AAAI
    - IJCAI
    - CogSci
output:
  primary_language: zh
  include_english_executive_summary: true
  report_directory: reports/radar
quality:
  require_source_traceability: true
  preserve_uncertainty: true
  run_missing_paper_attack_when_landscape_changes: true
  never_invent_fulltext: true
active_research_program: amsc
program_sources:
  program_file: research-programs/amsc/program.yaml
  master_literature: research-programs/amsc/state/master_literature.yaml
  gap_registry: research-programs/amsc/state/gap_registry.yaml
  state_of_field: research-programs/amsc/state/state_of_field.yaml
  exam_kb: research-programs/amsc/state/comprehensive_exam.yaml
  research_graph: research-programs/amsc/state/research_graph.yaml
amsc:
  mechanism_based_search: true
  track_anchor_researchers: true
  track_students_postdocs_collaborators: true
  tier1_venues: *a1
  tier2_venues:
    - ICRA
    - IROS
  preprints:
    - arXiv
  reject_keyword_only_overlap: true
  weekly_fixed_sections:
    - 本周论文及其总结分析
    - Master Literature List 更新
    - 当前研究现状与 Gap 更新
  primary_anchors:
    - Zhicong Lu
    - Judith Fan
    - Ziqiao Ma
    - Parastoo Abtahi
    - Ryo Suzuki
  foundation_paper: "2609.04384"
  program_version: "3.0"
  robot_requirement: false
  contribution_policy: Computational, resource, theoretical, empirical and system contributions are equal
    routes; human studies only when the claim needs them.
