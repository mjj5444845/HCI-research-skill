  integration_summary: Manicule 提供回应要求、理解证据和社会压力的质性基础；Sony proposal 将其推进到可创作、可检查和可迁移的表达系统。
  platform_summary: Microduck优先用于移动与全身行动表达。仍为预售；未确认拥有。若只需桌面凝视/对话，Reachy Mini可能更省力；只需稳定位移，轮式载体可能更合适。
