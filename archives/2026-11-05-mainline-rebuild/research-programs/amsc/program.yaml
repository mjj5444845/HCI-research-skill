program_id: amsc
version: "3.0"
name: Expressive Robot Communication and AI Companions with Physical Extensions
research_identity: I study how to design and author visual and embodied expressions that help people
  understand robots’ and AI companions’ requests, states, and subsequent actions; how these expressions remain
  interpretable and character-consistent across tasks and embodiments; and how adaptation and change shape
  expectations, burdens, and relationships over time, including companions with robotic or electronic
  extensions.
