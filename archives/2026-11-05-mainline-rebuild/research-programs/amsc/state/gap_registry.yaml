  - id: GAP-04
    statement: What evidence distinguishes expression recognition, pragmatic understanding, appropriate response,
      memory use, felt understanding and shared meaning for a specified research claim?
    status: REDEFINED
    priority: medium
    evidence:
      - paper_slug: x36-polite-but-misaligned
        evidence_level: MODERATE
        supports: Directional model–human disagreement and Neutral compression show that inter-model agreement and
          aggregate label accuracy do not establish alignment with a specified human pragmatic reference.
        boundary: English politeness only; reference panels are not universal human norms and the expert subset was
          selected for disagreement.
      - paper_slug: x37-clarification-not-correction
        evidence_level: PRELIMINARY
        supports: Separates retained context and acknowledgment from revision and explicit invalidation of an earlier
          interpretation.
        boundary: Two Gemini models, generated tasks and model judging; not a human-recipient or visual-feedback study.
      - paper_slug: x38-user-model-belief-distillation
        evidence_level: PRELIMINARY
        supports: Separates a model's editable inferred-user state from true user attributes and demonstrates limited
          causal influence on refusal behavior.
        boundary: Self-distilled, predefined attributes without human ground truth; white-box 7–8B models and
          substantial cross-attribute leakage.
      - paper_slug: x39-live-assistant
        evidence_level: PRELIMINARY
        supports: Separates whether, when, whom and what decisions in situated multimodal participation.
        boundary: Benchmark policy accuracy and teacher-reviewed trajectories do not establish usefulness, social
          appropriateness or shared meaning.
      - paper_slug: x40-msi-bench
        evidence_level: MODERATE
        supports: Decomposes multi-speaker voice interaction into speaker-scoped memory, instruction, authority,
          audience and restraint rubrics.
        boundary: Scripted/TTS scenes; rubric passing is not natural multi-party grounding or recipient outcome.
      - paper_slug: x41-ai-email-cultural-style
        evidence_level: PRELIMINARY
        supports: Shows that AI communication support can shift produced style markers and that uptake and shift vary
          across the sampled groups.
        boundary: Group, language and country are bundled; one bilingual coder, selective draft adoption and no
          recipient interpretation or real sending outcome.
      - paper_slug: x25-seeing-is-not-sharing
        evidence_level: MODERATE
        supports: Some VLMs conflate available task content with established referential alignment in MapTask
          overhearer judgments.
        boundary: Model-specific responses; one corpus and no interactive grounding.
      - paper_slug: x26-convention-gap
        evidence_level: MODERATE
        supports: A literal-posterior residual measures beyond-literal Hanabi cooperation but does not identify
          jointly formed conventions.
        boundary: Retrospective measurement; unilateral adaptation and shared convention remain separable hypotheses.
      - paper_slug: x28-continue-adapt-yield
        evidence_level: PRELIMINARY
        supports: In-turn content uptake is distinguishable from unchanged continuation and yielding.
        boundary: Outcome-informed cue labels and conditional coverage preclude an unbiased general human–model gap.
      - paper_slug: x29-testing-interchangeability
        evidence_level: PRELIMINARY
        supports: Role-matched swaps provide intervention evidence that formed notebook-equipped LLM dyads are not
          fully interchangeable in coordination cost.
        boundary: Formation-order/task-note differences remain; four swap pairs per setting, no human partners or
          mutual-meaning test; recovery arithmetic requires clarification.
      - paper_slug: x13-silica-agent-societies
        evidence_level: MODERATE
        supports: Per-agent label-pool permutation and apparatus perturbations expose shared-prior and
          presentation-driven convention false positives.
        boundary: AI–AI agent societies; pretrained label semantics remain shared and no embodied human–AI
          discriminant validation is provided.
      - paper_slug: x16-memuse-natural-integration
        evidence_level: MODERATE
        supports: Directly separates memory availability and elicited retrieval from natural conversational
          integration.
        boundary: Text-only deployment and observational satisfaction association; no partner-specific convention or
          embodiment.
      - paper_slug: x9-aligned-not-partner-specific
        evidence_level: MODERATE
        supports: Pseudo-dyads operationalize whether alignment depends on partner history.
        boundary: Preprint and AI–AI only.
      - paper_slug: x11-common-ground-benchmark
        evidence_level: MODERATE
        supports: A human–AI puzzle benchmark separates task, communication, and object-level grounding evidence.
        boundary: Single model and no embodied multimodal lifecycle.
      - paper_slug: c3-conceptual-pacts
        evidence_level: MODERATE
        supports: Provides a human partner-switch precedent for distinguishing lexical history from
          partner-independent reuse.
        boundary: Lexical entrainment remains an imperfect proxy for shared representation.
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: Pragmatic, rehearsal and KL ablations separate components of online adaptation.
        boundary: Does not distinguish partner specificity, mutual belief or convention.
      - paper_slug: x17-glossogen-emergent-language
        evidence_level: PRELIMINARY
        supports: Combines success, language-form, productivity, history-dose, swap, and clarification probes in one
          AI–AI testbed.
        boundary: Prompted protocol design and LLM-mediated linguistic measures limit construct validity.
      - paper_slug: x20-passing-the-pact
        evidence_level: PRELIMINARY
        supports: Shows why pact-term reuse and recipient-knowledge-sensitive elaboration must be measured separately.
        boundary: Abstract-only; no direct equivalence test or verified acceptance/repair measures.
      - paper_slug: x21-social-pragmatic-chinese-comments
        evidence_level: MODERATE
        supports: Adds context-component ablation, plausible-misreading alternatives and a human ambiguity ceiling for
          social-meaning diagnostics.
