      - paper_slug: e4-designing-robots-long-term
        evidence_level: MODERATE
        supports: Valerie 的九个月 field logs 是 novelty 后持续使用与 longitudinal instrumentation 的早期基准，但 aggregate visits
          不能被写成长期 relationship 证据。
        boundary: 本文支持：一个实用+角色化 receptionist robot 可在单一大学入口运行九个月并持续获得短 interaction，且可识别 repeat users
          更久停留。本文不支持：personality 或 evolving stories 因果维持兴趣、产生 common ground、形成 partner-specific
          convention，或代表一般家庭/工作场所中的长期 HRI。
      - paper_slug: f3-robotic-products-social-products
        evidence_level: MODERATE
        supports: F3 显示家用机器人会与家庭劳动、空间、产品和 social meaning 一起被重新组织，但小样本产品对比不能隔离 autonomy 的因果作用。
        boundary: 本文支持：在这 6 个家庭中，Roomba 比 Flair 更广泛地重组了 cleaning ecology 并触发 social/symbolic attributions，部分变化在一年
          follow-up 中持续。本文不支持：autonomy 是唯一原因、所有家庭/文化会如此、命名等同 relationship/common ground，或这些 meanings 已成为可识别的
          communication convention。
      - paper_slug: x49-long-term-agent-migration
        evidence_level: MODERATE
        supports: 五周互动中的机器人伙伴迁移
        boundary: 小样本原型不独立识别各线索因果作用；机构页漏列Ho，按论文首页保留四作者。
      - paper_slug: x53-realcompanion
        evidence_level: MODERATE
        supports: 真实conversation logs提供长期interaction record与selective-memory outcome。
        boundary: Benchmark understanding不等于relationship quality。
      - paper_slug: x56-evidence-lives
        evidence_level: PRELIMINARY
        supports: Mechanism execution与user rating可以错位。
        boundary: 单系统case不能建立一般因果。
      - paper_slug: x57-pair
        evidence_level: PRELIMINARY
        supports: 14天访谈将familiarity、relevant recall与early companionship联系起来。
        boundary: Single-group、无ablation，不能识别memory或expression效应。
      - paper_slug: x58-mind-perception-companionability
        evidence_level: PRELIMINARY
        supports: Agency与experience mind perception可能对应不同first-impression companionability维度。
        boundary: N=46、15分钟且planned manipulation check失败，不是长期关系证据。
      - paper_slug: x65-mourning-ai-companions
        evidence_level: MODERATE
        supports: 两次平台更新后loss framing、negative expression与restoration desire上升。
        boundary: 不能诊断个体或隔离具体continuity dimension。
      - paper_slug: x68-manicule
        evidence_level: PRELIMINARY
        supports: 等待可被部分参与者理解为社会负担，提出持续互动中的候选问题。
        boundary: VR、特定任务和样本；不证明AR原型效果、跨形态意义保持、长期关系或普遍模态优越。
      - paper_slug: x69-deco
        evidence_level: MODERATE
        supports: 七天自由使用提供early relational practice、continued-use intention与identity negotiation证据。
        boundary: 自选N=17、无field control、custom scales未验证且Perceived Companionship alpha=.59；不测试mismatch或repair。
      - paper_slug: x73-conversing-with-objects
        evidence_level: MODERATE
        supports: 两周trans-embodiment呈现情绪披露与关系/身份反思实践。
        boundary: 不是companion intervention或relationship outcome study；scripted probe、N=12且无对照。
      - paper_slug: x74-how-ai-companionship-develops
        evidence_level: MODERATE
        supports: 303名现有用户与110人四周StudyBot资料直接分开mental model、parasocial、engagement/disclosure和关系/依赖结果。
        boundary: 观察性关联、每周一次补偿使用与选择性流失；不测试角色一致性、失配、解释或修复。
      - paper_slug: x70-anthropomorphic-attitudes
        evidence_level: PRELIMINARY
        supports: 命名分组对关系式回复策略有不同即时偏好。
        boundary: 即时pairwise judgment不是实际任务、留存、信任、repair或关系质量，且命名proxy未经验证。
      - paper_slug: x75-grounded-robot-persona
        evidence_level: PRELIMINARY
        supports: Failure protocol与transparency已被提出为persona specification的必要组成。
        boundary: 模板没有经过用户mismatch/repair或持续关系评估。
      - paper_slug: x76-living-with-ai-companions
        evidence_level: MODERATE
        supports: 约一年两波调查把持续engagement、companionship use与self-disclosure同较低well-being及较少面对面互动联系起来。
        boundary: 37.1%留存、观察性路径、self-report和T2同期mediator/outcome；不建立social-displacement因果，也不测试character consistency或repair。
      - paper_slug: x78-beyond-small-talk
        evidence_level: MODERATE
        supports: Matched current disclosure下的模型关系行为仍受先前trajectory影响，提供history-conditioned evaluation先例。
        boundary: Synthetic conversations、LLM judges和text-only model outputs；不证明用户trust、attachment、reuse或relationship outcome变化。
      - paper_slug: x80-relational-complexity
        evidence_level: PRELIMINARY
        supports: 六类relational demand提出一致、顺从或低冲突可能通过降低repair、self-presentation、strategic uncertainty或reciprocity burden影响使用。
        boundary: Conceptual、非系统综述、无新实证；displacement、deskilling与具身外推均待验证。
      - paper_slug: x85-crafting-companions
        evidence_level: MODERATE
        supports: 真实robot-owner资料显示customization、self-extension、psychological ownership与community practice是attachment的竞争解释。
        boundary: Cross-sectional enthusiast sample与aibo偏重；mediation不能建立时间顺序、因果或互惠relationship quality。
      - paper_slug: x87-relational-schema-lock-in
        evidence_level: MODERATE
        supports: 互动历史可能让系统以旧schema替代当前意图；关系连续性设计必须同时允许纠错并保留用户当下agency。
        boundary: 不测relationship quality、trust trajectory、再次使用或具身互动；不能把schema lock-in直接称为关系伤害。
      - paper_slug: x88-out-of-sync
        evidence_level: PRELIMINARY
        supports: 五周团队部署显示即时有用性、accommodation及较慢的协作/情感评价可能具有不同时间尺度。
        boundary: 17团队、48人、无episodic memory、session配置调整与探索性crossover；不是长期companion关系或character-consistency因果研究。
      - paper_slug: x90-joint-action-review
        evidence_level: MODERATE
        supports: Joint-action综述要求把task fluency、shared representation、prediction与integration区分，防止用协调指标替代关系或相互理解结果。
        boundary: 理论/系统综述边界，不提供character mismatch、repair或relationship change的新因果效应。
    skeptic_challenge: 系统变化、interaction history、长期使用后果与owner investment均已有直接证据；剩余问题不是关系是否存在，而是在控制功能质量、便利性、既有依恋、customization和社会生态后，哪些角色一致性/违背、关系负担、解释与修复机制独立改变期待、校准、退出或关系重构。
