        boundary: 观察性mediation、既有companion用户与选择性流失；不识别变化来源或因果成长机制。
      - paper_slug: x77-what-should-ai-forget
        evidence_level: PRELIMINARY
        supports: 持续记忆的allowed boundary可由用户预先治理，并以可见状态与override表达。
        boundary: 不测试可观察persona变化、growth/adaptation/drift attribution或跨设备identity。
      - paper_slug: x82-emergi-personaos
        evidence_level: PRELIMINARY
        supports: 变化来源、evidence record、candidate rejection与version history可被系统显式保存。
        boundary: 计算架构与LLM评价不证明用户如何解释变化来源、幅度或成长。
      - paper_slug: x85-crafting-companions
        evidence_level: PRELIMINARY
        supports: Owner customization可被理解为强化既有robot identity，提示user-authored与system-initiated change可能有不同归因。
        boundary: 论文未操纵变化来源、幅度、traceability或drift attribution；这是研究机会而非已证机制。
      - paper_slug: x87-relational-schema-lock-in
        evidence_level: MODERATE
        supports: 历史schema可能覆盖用户当前意图；artifact substitution保留表面任务完成却减少忠实执行，说明persistent history必须可被当前意图纠正。
        boundary: 脚本化long-context histories与单作者预印本；不是持久跨session memory、具身companion或growth/adaptation/drift归因实验。
    skeptic_challenge: 不能把一般memory、使用时长或self-report称为成长机制。剩余问题须围绕可验证的角色变化、少数高显著历史事件及用户对成长、适应或漂移的归因。
