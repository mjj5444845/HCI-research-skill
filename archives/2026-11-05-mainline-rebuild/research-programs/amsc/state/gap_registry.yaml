  - id: GAP-03
    statement: "Convention lifecycle: establishment, maintenance, repair/revision, context-sensitive retirement,
      partner/context transfer, and renegotiation after breakdown"
    status: PARTIALLY_ADDRESSED
    priority: low
    evidence:
      - paper_slug: x28-continue-adapt-yield
        evidence_level: PRELIMINARY
        supports: In-turn content uptake is distinguishable from unchanged continuation and yielding.
        boundary: Outcome-informed cue labels and conditional coverage preclude an unbiased general human–model gap.
      - paper_slug: x29-testing-interchangeability
        evidence_level: PRELIMINARY
        supports: Role-matched swaps provide intervention evidence that formed notebook-equipped LLM dyads are not
          fully interchangeable in coordination cost.
        boundary: Formation-order/task-note differences remain; four swap pairs per setting, no human partners or
          mutual-meaning test; recovery arithmetic requires clarification.
      - paper_slug: x3-seeing-eye-to-eye
        evidence_level: PRELIMINARY
        supports: Eye2Eye整套AR系统减少错误和澄清需求；正文不支持显著缩短任务时间，组件混杂也不允许把收益单独归因于共享记忆。
        boundary: 短期整套系统收益；没有history severing、partner swap、角色互换或新表达协商。对象卡表示不等于双方确认的共同信念。
      - paper_slug: x11-common-ground-benchmark
        evidence_level: MODERATE
        supports: Human–AI joint-action and repair benchmark components already exist.
        boundary: Single-model text/puzzle preprint without partner-history ablation or transfer.
      - paper_slug: x6-beyond-local-surprise
        evidence_level: PRELIMINARY
        supports: Provides an explicit computational preserve/revise policy comparison.
        boundary: No human validation; selective policy does not outperform conservative retrieval baselines.
      - paper_slug: x12-partners-to-populations
        evidence_level: MODERATE
        supports: Provides theory and evidence for partner-to-population transfer.
        boundary: No embodied Agent or multimodal repair.
      - paper_slug: c4-repeated-reference-games
        evidence_level: MODERATE
        supports: Directly measures establishment, maintenance and feedback-contingent revision in repeated human
          reference.
        boundary: No retirement, transfer, partner swap or embodiment.
      - paper_slug: c8-gesturing-toward-abstraction
        evidence_level: MODERATE
        supports: Covers establishment and reuse of multimodal abstractions in human physical collaboration.
        boundary: Natural corrections are not controlled repair; no retirement, transfer or Agent.
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: Covers online establishment, local rehearsal and forgetting regularization for an artificial
          listener.
        boundary: No reciprocal repair, retirement, partner/context transfer or embodiment.
      - paper_slug: x17-glossogen-emergent-language
        evidence_level: PRELIMINARY
        supports: Provides establishment, explicit negotiation, clarification, one partner swap, and limited protocol
          transmission components.
        boundary: No controlled breakdown, retirement, multi-generation accumulation, human interaction, or physical
          embodiment.
      - paper_slug: x20-passing-the-pact
        evidence_level: PRELIMINARY
        supports: Adds a partner-knowledge and multiparty audience-design component to pact reuse.
        boundary: Elaboration is not controlled repair, and full lifecycle details are unavailable at abstract level.
      - paper_slug: x22-banana-man-pragmatic-interpretation
        evidence_level: MODERATE
        supports: Shows that tested VLM interpreters retain correct mappings yet fail to recover reliably after prior
          errors under limited feedback.
        boundary: Overhearer-style interpretation, not reciprocal online repair or renegotiation.
      - paper_slug: x24-multimodal-repair-detection
        evidence_level: MODERATE
        supports: Provides a multimodal detector for other-initiated-repair signals and repair types across two human
          dyadic corpora.
        boundary: Detection does not establish agent repair choice, production, uptake, or common-ground restoration.
      - paper_slug: x1-spotter-human-robot-conventions
        evidence_level: PRELIMINARY
        supports: SPOTTER 的 21 名成人 WoZ 试验显示描述趋于稳定但未清晰缩短；它提供动态视觉指称框架，不证明自主机器人形成互惠惯例。
        boundary: 21名成人的探索性描述复用，不等于自主机器人学习、HH/HRI等价、共同历史的因果作用或长期惯例。无显著性结果不能补写为不存在效应。
      - paper_slug: x2-lvlms-humans-ground-differently
        evidence_level: PRELIMINARY
        supports: 四种角色组合的89对篮子指称任务揭示GPT-5.2配置与人类的协作轨迹差异；不能把感知、错序和prompt故障统称为缺乏共同基础。
        boundary: 描述性比较支持该配置的轨迹差异；无history
          ablation，不能证明历史无贡献或所有LVLM不能grounding。README与论文关于排序/反馈存在配置差异，复现需核对branch/commit。
    skeptic_challenge: Convention maintenance, repair and transfer each have existing precedents. Select one
      concrete transition and compare its closest work; do not manufacture novelty by demanding every
      lifecycle stage in one study. Embodiment is optional and any transfer claim needs corresponding
      evidence.
