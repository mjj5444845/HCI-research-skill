      - paper_slug: x73-conversing-with-objects
        evidence_level: MODERATE
        supports: 两周trans-embodiment probe显示同一人会随物件和历史关系形成不同身份想象。
        boundary: Scripted chatbot、12名国际学生、无对照；不测试companion自身成长或漂移。
      - paper_slug: x74-how-ai-companionship-develops
        evidence_level: MODERATE
