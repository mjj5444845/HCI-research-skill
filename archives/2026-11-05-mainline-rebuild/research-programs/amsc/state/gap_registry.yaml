version: "3.2"
gaps:
  - id: GAP-01
    statement: How AI detects and updates interaction-dependent multimodal meanings; a long-term candidate
      requiring a concrete task and mechanism.
    status: REDEFINED
    priority: low
    evidence:
      - paper_slug: c6-visual-resemblance-interaction-history
        evidence_level: MODERATE
        supports: Interaction history changes pictorial meaning within a repeated human-human drawing paradigm.
        boundary: Controlled human drawing; yoked-vs-shuffled isolates same-producer sequence exposure, not mutual
          common ground or embodied-agent detection.
      - paper_slug: x12-partners-to-populations
        evidence_level: MODERATE
        supports: CHAI models how partner-specific common ground and population conventions coexist and transfer.
        boundary: Human linguistic coordination and simulation; no embodied human–AI agent.
      - paper_slug: c8-gesturing-toward-abstraction
        evidence_level: MODERATE
        supports: Human physical dyads develop and reuse speech/gesture abstractions with diverging dyad vocabularies.
        boundary: No Agent, partner swap, history severing or transfer.
      - paper_slug: e3-continual-adaptation-machine-communication
        evidence_level: MODERATE
        supports: An artificial listener updates linguistic reference expectations online from interaction history.
        boundary: One-sided visual-reference adaptation; non-embodied and no dyad/population transfer.
      - paper_slug: x23-machine-mental-imagery-common-ground
        evidence_level: PRELIMINARY
        supports: Incrementally externalizes dialogue-derived visual and textual state and distinguishes confirmed,
          unresolved and assumed content.
        boundary: Offline QA over human dialogue traces; system-side state tracking is not partner-specific meaning
          change or mutual common ground.
      - paper_slug: x1-spotter-human-robot-conventions
        evidence_level: PRELIMINARY
        supports: SPOTTER 的 21 名成人 WoZ 试验显示描述趋于稳定但未清晰缩短；它提供动态视觉指称框架，不证明自主机器人形成互惠惯例。
        boundary: 21名成人的探索性描述复用，不等于自主机器人学习、HH/HRI等价、共同历史的因果作用或长期惯例。无显著性结果不能补写为不存在效应。
    skeptic_challenge: Human meaning formation, visual conventions and partner-to-population transfer have direct
      precedents. Choose a concrete claim and compare the closest work; no robot, repair or transfer
      requirement applies to every understanding study. Do not dismiss Wizard-of-Oz work solely because it is
      non-autonomous or manufacture novelty by combining untested conditions.
    history:
      - date: 2026-08-27
        from: ACTIVE
        to: REDEFINED
        reason: C6 and X1 make a generic absence-of-meaning-formation claim too broad.
      - date: 2026-08-27
        from: REDEFINED
        to: REDEFINED
        reason: CHAI removes generic transfer-theory absence; residual opportunity is embodied human–AI inference
          across dyad and population levels.
      - date: 2026-09-07
        from: REDEFINED
        to: REDEFINED
        reason: X23 supplies an inspectable multimodal state-representation architecture but leaves partner-specific
          meaning change, mutual acceptance and embodied online updating untested.
      - date: 2026-09-12
        from: REDEFINED
        to: REDEFINED
        reason: 五篇积压全文补审及独立gap_red_team复核；保留既有状态与优先级。X1是直接WoZ先例，X3组件混杂，X4开放记忆未实测，X5为概念综述，不能计为独立实证重复。
      - date: 2026-09-18
