  - id: A4
    citation: Neil Cohn (2007). A Visual Lexicon. Public Journal of Semiotics, 1(1), 35–56
    source_url: https://journals.lub.lu.se/pjos/article/view/8814
    rq: 当有意义的 form–meaning pairings 可大于或小于 panel 时，什么构成 visual lexical item？如何依据功能结构而非表层等同，把 visual language 与
      verbal lexicon、morphology、syntax、constructions 比较？
    theory:
      - 视觉语言理论（Visual Language Theory）
      - Jackendoff 的平行架构（Parallel Architecture）
      - 构式语法（Construction Grammar）
      - 形态学与开放/封闭词类（morphology; open/closed lexical classes）
      - 图形/背景（Figure/Ground）
      - 注意窗口化（windowing of attention）
    method: 理论建模与比较性 semiotic/linguistic analysis，没有原创实验或系统 corpus。作者借用 Jackendoff 的 Parallel
      Architecture、construction grammar、morphology、open/closed lexical classes、Figure/Ground 与 windowing of
      attention，以自绘例子和选取的 comics、Australian sand narratives、Wally Wood panel schemas、heart/speed-line/balloon
      conventions、advertising strips 作 analytical illustrations；提出 Lexical Representational
      Matrix（Polymorphic/Macro/Mono/Micro/Amorphic）、attention units、E-Conjunction、visual morphology 与 possible
      constructions。
    finding: >-
      该文没有原创 empirical findings；以下是其理论论证与 illustrative analyses。

      Panel 是 visual sequence 中聚焦信息的 attention unit，而不是稳定、可直接等同于 word/sentence 的最小 lexical 或 syntactic unit：多个
      panels 可通过 E-Conjunction 形成一个 constituent，一个 Polymorphic panel 也可容纳完整事件结构。

      多数 panel representations 在线组合自较小的、储存在 long-term memory 的 productive schemata；与此同时，hearts、speed
      lines、thought balloons 等较封闭且 conventionalized 的 signs 可作为 visual morphology 依附、替换或修改 productive roots。

      Visual lexical items 可跨多个粒度：小于 panel 的 productive/conventional signs、某些稳定 panel schemas，以及大于 panel 的
      potential constructions；决定性标准是 form–meaning pairing，而非与 verbal word 的表层相似性。

      媒介与 interaction ecology 可能塑造 visual lexicon：作者对比实时、沙地绘制的 Arrernte signs 与非实时 print comics，提出速度/材料约束与
      conventionality/productivity 的关系，但这只是理论性解释而非经检验因果结果。
    limitation: 可作为 visual-language representation 的 conceptual framework 与可检验 hypotheses 来源；不可把其 categories
      当作已验证的 cognitive universals、把 comics/sand narratives 的对比当作媒介因果证据，或据此声称 emoji/robot signals 已构成
      lexicon、grammar 或共同 convention。
