  - id: X22
    citation: Alvin W. M. Tan, Ben Prystawski, Veronica Boyce (2026). Which one is banana man? Evaluating
      vision–language models in multi-turn pragmatic interpretation. arXiv preprint
    source_url: https://arxiv.org/abs/2608.29571
    exam_theme: 2
    theory:
      - pragmatic interpretation
      - convention retrieval
      - context relevance
      - feedback and error recovery
    rq: Can vision-language models pragmatically interpret conventionalized descriptions across multiple turns,
      and how do context amount, order, relevance, and feedback quality affect that ability relative to
      humans?
    method: Using ten 2–6-player, six-round Tangram games and naïve human matcher data, the study evaluates five
      open-weight VLMs across eight context conditions and three feedback regimes. New human samples cover
      backward and random order; model analyses compare interactive limited feedback, human-yoked limited
      feedback, and full feedback, with bootstrap intervals and additional frontier-model checks.
    finding: >-
      Models improved substantially when correct, relevant prior mappings were supplied and could approach
      human or near-ceiling performance under human-yoked or full feedback.

      With their own guesses plus only correct/incorrect feedback, models improved little and performed at or
      below chance after a prior mistake, while naïve humans corrected roughly half of prior errors.

      Context from the same game and prior instances of the same tangram mattered most; other-game or
      target-ablated context produced much lower performance, supporting retrieval of convention-specific
      mappings more than general task learning.

      Images helped most early or when contextual mappings were sparse; later performance was often similar
      without images, and trial-level model-human correspondence remained weak.
    limitation: Shows that tested VLMs can retrieve externally available mappings yet struggle to bootstrap and
      repair them in this constrained overhearer task; it does not establish that all models cannot form
      conventions or that retrieval alone is grounding.
    relation_to_mainline: 以多轮解释连接近期理解与长期互动，区分外部映射检索、形成和修复。
    gap_supported_challenged:
