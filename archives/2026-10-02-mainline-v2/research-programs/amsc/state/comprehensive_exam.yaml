  - id: B2
    citation: Judith Degen (2023). The Rational Speech Act Framework. Annual Review of Linguistics, 9, 519–540
    source_url: https://alpslab.stanford.edu/papers/2023Degen.pdf
    exam_theme: 2
    rq: RSA 如何整合 linguistic knowledge、communicative pressures、context 与 subjective priors；哪些机制成功，哪些问题仍未解决？
    theory:
      - Rational Speech Act
      - gradient informativeness
      - contextual alternatives
      - joint inference over QUD, lexicon and common-ground variables
    method: Annual Review narrative/tutorial synthesis，以 scalar implicature 为主例，重建 equations、classic-vs-RSA
      comparison、extensions 与 empirical/modeling work；不是 systematic review/meta-analysis，无原创实验。
    finding: RSA 将 interpretation、informativeness、alternatives 与 world knowledge 形式化为概率化、context-sensitive
      components。 已有 extensions 覆盖 reference、social meaning、adaptation、convention formation 与 repeated
      exposure；主要挑战是 scalability、bounded cognition、incrementality/compositionality。
    limitation: 非系统综述且以 scalar implicature 组织；开放式 multimodal joint action 距离大，alternative set、prior、utility 与
      linking hypothesis 存在 underidentification。
