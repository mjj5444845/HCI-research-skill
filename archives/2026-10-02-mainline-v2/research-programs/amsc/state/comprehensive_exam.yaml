      - A6
      - X12
      - X21
    discussion: 比较个体经验、伙伴关系、平台实践及群体预期，讨论群体内差异；X12是跨层理论连接，不是文化群体比较。
  - question: 从静态材料走向互动，会多出什么问题？
    papers:
      - X31
      - X24
      - C8
      - X16
      - X22
    discussion: 讨论时间顺序、声音/手势、反馈、记忆相关性和理解确认；互动研究是可选问题路径，不是所有计算贡献的门槛。
  - question: 我们怎样知道一项解释比替代解释更好？
    papers:
      - B2
      - X30
      - X9
      - C3
    discussion: 比较理论拟合、消融、行为结果与反事实对照；解释性或设计研究还应讨论情境、参与者意义和分析过程，方法随问题选择。
organization_policy: 六组是可交叉的阅读入口，不是六章固定目录或先后依赖；可从现象、理论、计算或互动进入，按考试题目选取跨组证据。
reading_depth_policy: 30篇均进入准备池，但无需同等深读。先用每篇的问题、方法、发现和边界完成全景阅读；再按实际考试问题选择理论锚点及相互补充或冲突的实证做深读。未指定固定深读名额。
