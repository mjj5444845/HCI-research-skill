  - id: E3
    citation: Robert Hawkins, Minae Kwon, Dorsa Sadigh, Noah Goodman (2020). Continual Adaptation for Efficient
      Machine Communication. CoNLL 2020, 408–419
    source_url: https://aclanthology.org/2020.conll-1.33/
    exam_theme: 5
    rq: 人工 listener 如何从 shared interaction history 在线更新 partner-specific semantics，同时保留 population knowledge 并允许
      compositional shortening？
    theory:
      - Lewisian convention
      - Gricean pragmatics
      - common ground
      - Rational Speech Act
      - interaction-timescale adaptation
    method: Repeated reference game with four similar COCO images, each target repeated six times, 24 trials.
      ResNet-152 plus LSTM captioner is adapted online using likelihood, pragmatic contrast, KL
      regularization, compositional augmentation and local rehearsal. Human baseline 108 participants/54
      dyads; adaptive-listener study 57 additional human speakers; ablations and 52 easier-context forgetting
      analyses.
    finding: human dyads maintained near-ceiling accuracy while utterances shortened, t=25.8,p<.001.
      adaptive-listener accuracy rose roughly 37%→93%, z=12.6,p<.001; offline non-adaptive baseline did not
      improve over time. without KL, unseen-context accuracy fell about 10% vs 2% for full model; removing
      rehearsal or pragmatic objective significantly hurt performance.
    limitation: 主 human study 是 human speaker→adaptive listener 的 one-sided role；无 repair、role reversal、partner
      swap/pseudo-dyad、retention/transfer 或 embodiment，且 non-adaptive comparator 是 offline。
    relation_to_mainline: 连接长期持续互动；区分记忆、单方适应与共同意义。
