  - id: X9
    citation: "Po-Ya Angela Wang, Chinmaya Mishra, Aslı Özyürek, Paula Rubio-Fernández, Esam Ghaleb (2026).
      Aligned but Not Partner-Specific: Distinguishing How Multimodal LLM Agents Succeed in Reference Games
      Without Human-Like Conventions. arXiv preprint"
    source_url: https://arxiv.org/abs/2606.08081
    rq: MLLM reference-game alignment 来自具体 dyad 的 shared history，还是共享任务 vocabulary、pretrained priors 与 verbosity？
    theory: []
    method: 比较 45 个 GPT-5 MLLM dyads/905 rounds 与 42 个 human dyads/3,288 rounds，并构造匹配 referent、round、turn count 与
      success 的 pseudo-dyads。
    finding: |-
      Humans 随互动压缩表达，real dyads 相对 pseudo-dyads 显示 interaction-dependent reuse。
      Agents 保持冗长；real/pseudo overlap 近 ceiling 且无可靠差异，说明 coordination 可不依赖具体 partner history。
    limitation: 支持‘alignment/coordination 不足以证明 convention’，但不能推出所有模型或所有 training regimes 都缺乏 partner-specific grounding。
    gap_supported_challenged:
      - GAP-04
