      - 语境依赖意义（context-dependent meaning）
    method: 在线 Understanding Emoji Survey。作者从 14 个 graphicon-rich public Facebook groups 选取 46 个自然发生的
      emoji-containing comments 及其最相关的先行话语；有目的地纳入先前难编码案例，再补齐 13 类 emoji 与功能覆盖，并对消息匿名化、简化，部分 multimodal prompts
      改为文字描述。14 人 pilot 后，以 Qualtrics 发布四个平衡版本：每人先做 sample，再评 12 个 items；原 45 个非 sample messages 中有 3
      个难例重复一次，合计 49 item instances。658 份问卷中，523 份满足最低纳入标准；样本平均 28.6 岁，74.2% native English、75% 居住美国。参与者从基于
      Herring & Dainas (2017) taxonomy 的功能选项中选择；作者比较 function frequencies、emoji-type patterns、inter-respondent
      agreement 与 user–researcher agreement，并粗略 content-analyze open responses。
    finding: >-
      Tone modification 占全部功能选择的 52.6%，并在 49 个 item instances 中的 39 个成为首选；virtual action 为第二常见功能（13.4%），其后是
      mention（7.8%）、softening（6.3%）与 reaction（5.5%）。

      同一 rendering（如三个 heart items）在不同 local discourse contexts 中分别以 action、tone、mention 为首选；相反，一些 rendering
      有变化的 emoji types 仍一致以 tone 为首选，支持 context 对 function interpretation 的作用可超过 rendering，且有时超过孤立 semantics。

      用户首选功能的一致性高于随机水平，但总体 agreement 未超过 60%，且随 emoji type/function 变化；tone 的一致性最高，reaction 与 mention 最低，因此提供
      local context 并未消除 ambiguity/misconstrual。

      当把用户第一与第二常见选择都计入时，用户对研究者的多数分类达成一致；结果总体支持原 taxonomy，但显示 lay users 比研究者更强烈地默认选择 tone modification。

      作者据此主张 emoji 是 online language 的 pragmatic component / illocutionary-force marker，但明确不主张 emoji 构成独立完整语言。
    limitation: 可支持：在这组 contextualized public-Facebook examples 中，emoji 常被解释为 tone modifier，且 local discourse
      context 会改变 perceived pragmatic function。不可支持：所有平台/文化/关系中的 emoji 都以 tone 为基本功能；context
      保证正确理解；该研究观察到共同意义如何形成；这些结果可直接迁移到 robot-authored signals。
    relation_to_mainline: 解释多模态表达如何承载社会意义，并区分AI支持人际沟通与AI作为沟通伙伴。
