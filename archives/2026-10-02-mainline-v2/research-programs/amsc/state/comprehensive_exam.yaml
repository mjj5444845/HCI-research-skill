    citation: Saujas Vaduguru, Yilun Hua, Yoav Artzi, Daniel Fried (2026). Success and Cost Elicit Convention
      Formation for Efficient Communication. ACL 2026, 42033–42050
    source_url: https://aclanthology.org/2026.acl-long.1946/
    rq: 能否在没有新增 human demonstration data 的情况下训练 LMM 随互动形成更短且更成功的 referring expressions？
    theory: []
    method: 以 simulated photo/tangram reference games 生成 success+cost preference pairs，进行 DPO-style
      post-training，再以 model-speaker→human-listener games 比较 baselines。
    finding: |-
