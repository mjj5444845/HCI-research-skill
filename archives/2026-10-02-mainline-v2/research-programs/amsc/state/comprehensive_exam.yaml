  - id: X21
    citation: Shiwei Hong, Junjie Ma, Emma Jiren Wang, Ethan Z. Rong, Siying Hu, Haichang Li, Ziying Wang, Zhicong
      Lu (2026). You Really Didn’t Get That? Benchmarking Social Pragmatic Inference for Indirect and Playful
      Chinese Online Comments. EMNLP 2026 Main Conference; arXiv preprint
    source_url: https://arxiv.org/abs/2609.04384
    exam_theme: 2
    rq: Can current language models recover the target, stance, wordplay mechanism, and interactional force of
      indirect or playful comments embedded in Chinese-language online interaction?
    theory: []
    method: The authors purposefully sampled public interaction episodes from Zhihu, Tieba, Douban, and
      Xiaohongshu, screened more than 12,000 examples to retain 3,200 episodes, and generated 4,735
      five-choice items with eight writer models and seven trained native-Chinese, high-frequency social-media
      users. They report three 200-item reliability audits, leave-writer-out solver accuracy, a random
      300-item human audit, context ablations, and qualitative error cases.
    finding: >-
      Across the tested model versions, reported leave-writer-out accuracy averaged 68.70%, while a random
      300-item human audit reported 90.8% accuracy and kappa .85; these are not paired estimates on identical
      item sets.

      Removing the reconstructed interaction context reduced mean model accuracy from 68.70% to 29.63%, a
      39.07-point drop within this deliberately context-dependent benchmark.

      The 343 human-revised difficult items produced only 64.14% human accuracy and kappa .53, revealing a
      meaningful ambiguity/gold-stability boundary.
    limitation: Supports context sensitivity within a purposefully sampled Chinese-language benchmark, not a claim
      about Chinese culture, all Chinese speakers, general cultural competence, dyadic common ground, or
      embodied adaptation.
    relation_to_mainline: 服务近期情境化语用理解，检验信号、上下文、用意与解释之间的关系。
