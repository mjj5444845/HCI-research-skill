  - id: C4
    citation: Robert D. Hawkins, Michael C. Frank, Noah D. Goodman (2020). Characterizing the Dynamics of Learning
      in Repeated Reference Games. Cognitive Science, 44(6), e12845
    source_url: https://onlinelibrary.wiley.com/doi/full/10.1111/cogs.12845
    exam_theme: 3
    rq: reduction 的 syntax/feedback dynamics、convention 的 stability/arbitrariness 与 context discriminability
      如何随重复互动变化？
    theory:
      - collaborative reference
      - common ground
      - stability and arbitrariness
      - Gricean informativity
      - cross-situational distinctiveness
    method: 480 AMT participants；free-matching pilot 218 人、confirmatory 262 人；exclusions 后 56 pilot games 与 83
      dyads/7,867 messages。12 tangrams×6 blocks，双向 text chat 与即时 feedback；confirmatory analyses
      preregistered，结合 dependency parsing、mixed models、GloVe/token analyses 与 permutation checks。
    finding: descriptions 缩短，matcher backchannel 从首 block 75% 的 matchers 发言降到末 block 4%。 speaker 按同一 tangram 上轮正负
      feedback 调节下一次长度；closed-class words 更易被成簇删除，initially distinctive words 更可能保留。 within-dyad successive
      expressions 更相似，between-dyad 表达更分歧且逐渐稳定。
    limitation: 把一 trial 内多轮 dialogue collapse 为单 utterance，丢失 grounding/repair sequence；人工清洗与 GloVe 表示有偏差；无
      partner swap/history ablation。
    relation_to_mainline: 作为共享意义的理论基础；按问题调用，不规定首项研究必须研究惯例形成。
