  - id: B4
    citation: "Judith Degen, Robert D. Hawkins, Caroline Graf, Elisa Kreiss, Noah D. Goodman (2020). When
      Redundancy Is Useful: A Bayesian Approach to ‘Overinformative’ Referring Expressions. Psychological
      Review, 127(4), 591–621"
    source_url: https://arxiv.org/abs/1903.08237
    rq: 把确定性的 Boolean semantics 改为 continuous/noisy semantics 后，Rational Speech Act production model 能否统一量化解释
      modifier-type 与 scene-variation redundancy、atypical-feature mention，以及 taxonomic-level choice？
    theory:
      - 理性言语行为框架（Rational Speech Act）
      - Gricean informativeness 与 cost
      - 连续/有噪语义（continuous/noisy semantics）
      - 典型性与 basic-level categorization
      - Bayesian pragmatics 建模
    method: 理论+实验+Bayesian computational modeling。作者提出 continuous-semantics RSA（cs-RSA），speaker 在 utterance cost
      与相对于 noisy/graded literal-listener semantics 的 informativeness 间优化。三个 interactive web reference-game
      datasets：Exp.1 用 MTurk 58 个有偿 pairs（另纳入 7 个中途退出 pairs 的已有 data），自由文本指称同类但 color/size 不同的 arrays；36
      critical+36 filler trials，操纵 sufficient feature、2–4 distractors 与 scene variation，2076 critical cases
      入分析。Exp.2 用 61 pairs、42 trials、7 类 color-diagnostic foods 的 typical/mid/atypical colors，1827 utterances
      入分析，并以三个独立 norming studies 获得 utterance–object typicality。Exp.3 使用 Exp.1 同一 58 pairs 的另外 36 filler
      trials作为 nominal-choice critical data，跨 9 domains 操纵 subordinate/basic/superordinate sufficiency，1872
      cases 入分析，另做 typicality norms。Behavior 用 mixed-effects models；cs-RSA 以 Bayesian inference、posterior
      predictive fit 与 Bayes-factor/marginal-likelihood model comparisons 评估不同 semantics/cost specifications。
    finding: >-
      Exp.1 replicated redundant color > redundant size，并复现 scene variation 增加 redundant color；同时发现 scene
      variation 也增加 redundant size，但幅度较小。cs-RSA 通过把 size 估为比 color 更 noisy（MAP semantic value .79 vs
      .88）拟合该不对称；modifier cost posterior 接近零。

      Exp.2 replicated color-typicality effect：对象越不符合 unmodified noun 的典型性，speaker 越可能加 color；contextual
      utility 仍有独立作用。整合 type-level noise 与独立 elicited object-level typicality、且无 cost term 的模型最佳，其 item-level
      predicted 与 empirical proportions correlation 为 r=.94（in-sample fit）。

      Exp.2 还显示典型性可强到使 speaker 在 color 原则上有辨别价值时仍把典型 yellow banana 简称 banana，而 atypical blue banana 的 color
      会被明示；这说明‘必要信息’本身依赖 graded semantic expectations。

      Exp.3 replicated basic-level preference：superordinate mentions 少于 2%，subordinate terms 主要在必须区分同
      basic-category distractor 时占优；即便 subordinate necessary，仍有 28% basic-level expressions（其中多数含额外 modifying
      material）。context、typicality 与 word length共同预测 choice，cs-RSA 延伸到 nominal abstraction level。

      作者的最大可辩护结论是：在受控英文视觉指称任务中，continuous semantic fit 使多个看似 overinformative patterns 能在同一 rational production
      architecture 下被解释为 useful redundancy；模型仍对真实心理算法及是否显式以 listener needs 为导向保持 agnostic。
    limitation: 可支持：在这些 reference games 中，graded semantics+context/typicality能解释 speakers 的系统性 redundancy 与
      abstraction choices。不可支持：所有冗余都提升理解；cost 在一般 communication 中不重要；cs-RSA 是实际 cognitive algorithm；verbal
      object reference 的参数可直接规定 robot multimodal output；该研究解释 shared meaning/conventions 如何随互动形成。
