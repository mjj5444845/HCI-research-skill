  - id: X24
    citation: Anh Ngo, Nicolas Rollet, Catherine Pelachaud, Chloé Clavel (2026). Do Visual Features Improve
      Other-Initiated Repair Detection? A Dyadic Multimodal Approach. Proceedings of ACM ICMI 2026
    source_url: https://arxiv.org/abs/2607.23845
    rq: Do visual behaviors improve automatic detection and classification of other-initiated repair, and do
      useful cues differ across language and interaction setting?
    theory: []
    method: A hierarchical text-audio-visual classifier is evaluated with session-level five-fold cross-validation
      on French screen-mediated NOXI (47 OIR instances in seven hours) and Dutch face-to-face task-oriented
      CABB-S (378 instances in eight hours). Handcrafted, Conversation-Analysis-grounded visual features cover
      both participants' gaze, facial action units, head, body, holds, gesture, and dyadic coordination.
    finding: >-
      Adding visual features to text and audio increased detection macro-F1 by 4.1 points on NOXI and 12.9
      points on CABB-S.

      For repair-type classification, visual features added 13.2 points on NOXI but only 2.4 points on CABB-S,
      indicating strong setting dependence.

      NOXI estimates were unstable because OIR instances and restricted offers were sparse; visual-only
      features lacked sufficient specificity.
    limitation: Supports multimodal detection of human OIR signals in two corpora; it does not show that an agent
      can choose, execute, or learn an effective repair policy or build common ground.
