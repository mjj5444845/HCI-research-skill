  - id: A6
    citation: "Emma Jiren Wang, Siying Hu, Zhicong Lu (2026). PuppetChat: Fostering Intimate Communication through
      Bidirectional Actions and Micronarratives. CHI 2026, Article 1295, 1–19"
    source_url: https://arxiv.org/abs/2602.19463
    rq: 日常 dyadic IM 如何通过 reciprocal embodied actions、轻量 personalized micronarratives、user control 与可回访 shared
      traces，超越 terminal reactions 和 generic symbols？close partners 会怎样在真实使用中采用并体验这种设计？
    theory:
      - 社会临场理论（Social Presence Theory）
      - 联合行动与人际协调（joint action / interpersonal coordination）
      - 可解释歧义（interpretable ambiguity）
      - 叙事性自我披露（narrative self-disclosure）
      - AI-mediated communication 中的 agency 与 control
      - 关系维持与 shared memory
    method: Research-through-design 加两阶段混合方法评估。Formative phase：5 名 frequent IM users 与早期 12-action demo 互动 30–40
      分钟，随后 semi-structured interviews；两位作者独立生成 codes、讨论达成一致，形成 reciprocity、personal narrative、editability 与
      persistence 四个 design goals。System phase：实现 one-to-one PuppetChat，含 42-action library、关键词/情绪/embedding
      scoring、ReactionCandidates 与 responsive-role bias、基于 user story+action+conversation context 的 Azure
      OpenAI micronarrative generation、编辑/重生成、action-only ephemerality 与 persistent replay。Field phase：11 个既有
      close dyads（N=22；6 best-friend、5 couple；21–28 岁）连续使用 10 天；Days 1–6 每天选 topic 交谈至少 15 分钟，Days 7–10
      可自由聊。资料包括 interaction logs、每日两题 micro-survey、post-study 自建 16-item four-dimension scale、SUS、NASA–TLX，以及每
      dyad 40–60 分钟访谈；定量仅作 descriptive/reliability summaries，访谈与开放题采用 reflexive thematic analysis。
    finding: >-
      日志显示每位参与者平均触发 Actions 18.0 次、发送 14.5 个 actions（约 80% trigger-to-send）；约 57% sent actions 附
      micronarrative（M=8.2），每人平均 13.2 次 edits，说明 participants 并非只被动接受生成结果。

      自建量表四维均值为 5.1–5.4/7（Co-presence & Affective Intimacy 5.3、Reciprocal Interaction 5.1、Personalized
      Micronarratives 5.2、Agency & Persistence 5.4）；这些是无对照的使用后描述，不能证明系统造成提升。

      访谈中，complementary/mirrored replies 被体验为 asynchronous co-performance；参与者把 action+caption exchanges 描述为
      togetherness、shared routines 与期待被回应，而非孤立 sticker reactions。

      可编辑 micronarratives 支持 indirect/face-saving disclosure 与 playful appropriation；部分 dyads 将 generic
      prompts 改造成 inside jokes 或 private shorthand，但不同参与者对 personalization effort 的意愿明显不同。

      对 personal history 的直接连接并不稳固：Connection item 是全量表最低（M=4.27），作者因此承认 generic generation 未必能承载 relational
      history，即便 participants 有时用编辑把它变成 relationship-specific meaning。

      Participants 强烈偏好保留互动记录（reverse-coded Ephemeral item M=6.27）；SUS 报告 M=86.59、NASA–TLX RTLX M=31.72，但论文给出的
      SUS 95% CI [68.71, 84.47] 不包含其均值，属于需要核对的内部统计报告错误。
    limitation: 可支持：这 11 个 close dyads 在短期、结构化 deployment 中实际使用、编辑并有时 appropriated reciprocal
      action+micronarrative scaffolds，且主观报告 presence、disclosure、continuity 与 shared meaning。不可支持：PuppetChat
      因果提升 intimacy；任何单一 feature 是机制；10 天内形成了稳定/新颖 convention；效果可推广到 non-intimate、intercultural、neurodivergent
      或 human–embodied-AI interaction。
