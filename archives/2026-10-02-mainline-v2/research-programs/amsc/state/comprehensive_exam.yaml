writing_plan:
  - section: 提出现象与核心问题
    pages: 约1
    goal: 从具体表达或沟通情境切入，说明为何值得解释；可从X21、花字、meme或关系沟通开始。
  - section: 组织概念与理论对话
    pages: 约2
    goal: 按题目选择语用、视觉/多模态结构、grounding或社会实践视角，比较解释单位与假设。
  - section: 比较跨方法的证据
    pages: 约3
    goal: 围绕2–3个问题比较人类研究、模型方法、benchmark及系统实践；不按30篇逐篇摘要。
  - section: 展开张力、边界与替代解释
    pages: 约2
    goal: 从歧义/准确、效率/表达、个体/群体、单次/持续等讨论线索中选取，不要求全部覆盖。
  - section: 综合与开放问题
    pages: 约1
    goal: 提出仍可辩护的认识与多个可能方向；区分证据空白、测量局限与候选研究机会。
checklists:
  - name: 定义与比较
    items:
      - 用自己的例子区分识别、语用解释、恰当回应、被理解感与共享意义。
      - 比较RSA、结构性多模态理论与互动grounding的解释单位。
  - name: 证据与批判
    items:
      - 逐篇说明任务、样本、比较条件、发现与外推边界。
      - 解释X21难例歧义、X30指标效度与X31顺序任务边界。
      - 比较X32与X35的技术机制、基线和消融，不把性能提升等同真实意图恢复。
  - name: 连接与综合
    items:
      - 区分AI作为伙伴与AI支持人际沟通，并用X33/A1举例。
      - 区分信息记忆、自然使用历史、单方适应与共享意义。
      - 解释文化知识、平台实践及群体内差异，避免国籍等同文化。
  - name: 推导研究问题
    items:
      - 从已有研究提出具体问题，说明新增贡献与可能反例。
      - 分别说明计算评估、行为证据或解释性材料何时能支持所作主张。
      - 保留候选问题状态；不将考试提纲当作已批准研究项目。
  - name: 跨主题开放讨论
    items:
      - 任选一个现象，从至少两个理论视角提出不同解释。
      - 比较一种计算证据和一种行为、体验或实践证据，说明各自能回答什么。
      - 为自己的解释提出合理反例，并说明什么观察会使你修改判断。
      - 提出两个可行的后续方向，不把阅读清单锁成单一RQ或技术路线。
reading_queue_note: top20_order为兼容现有消费者保留的字段名；当前含30篇，历史20篇顺序保存在workflow_history。
reading_groups:
  - id: expression
    name: 表达形式如何承载社会意义
    papers:
      - A2
      - A3
      - A4
      - A5
      - X33
    question: 从文字副语言、emoji、视觉词汇到花字，哪些意义来自形式，哪些来自情境和使用？
    bridge: 先认识表达资源，再追问同一形式为什么能被理解成不同用意。
  - id: interpretation
    name: 人和AI如何推断用意
    papers:
      - X21
      - B1
      - B2
      - B3
      - B4
    question: 人怎样结合目标、语境与不确定性解释表达？简洁和信息充分是否总是一致？
    bridge: 把表达现象连接到可比较的推理解释；X21是问题入口，不限定所有后续讨论。
  - id: evaluation
    name: 如何建模与获得可信的能力证据
    papers:
      - X30
      - X31
      - X32
      - X35
      - X24
    question: 定位、排序、解释、分类及修复信号检测各自揭示了什么？模型改善怎样获得证据支持？
    bridge: 从理论转向模型、数据与测量，再追问测试中的能力如何联系实际沟通。
  - id: social_context
    name: 文化知识、关系与沟通实践
    papers:
      - A1
      - A6
      - X34
      - X27
      - X12
    question: 谁在与谁沟通、共享哪些经历、为什么要这样表达？关系体验、有用歧义与群体惯例如何进入讨论？
    bridge: 把单次任务放回伙伴、关系与群体；X12连接个人经验和群体预期，不作为文化差异的直接实证。
  - id: shared_meaning
    name: 理解如何在互动中得到确认和形成
    papers:
      - C1
      - C2
      - C3
      - C6
      - C8
    question: 双方怎样确认足够的理解，并形成可复用的语言、绘画或手势表达？
    bridge: 比较单次推断与协作过程；多模态物理任务只是一个观察窗口。
  - id: adaptation
    name: 持续沟通中的记忆、学习与适应
    papers:
      - E3
      - X8
      - X9
      - X16
      - X22
    question: 模型能学到什么、历史怎样被使用、何时只是表面协调？哪些改善值得保留，哪些解释仍需检验？
    bridge: 让训练、在线适应、记忆使用与多轮解释互相对照，再回到最初的理解与表达问题。
discussion_questions:
  - question: 沟通的好坏，是否只有准确理解这一项标准？
    papers:
      - X21
      - X30
      - X33
      - A6
    discussion: 比较任务正确率、表达机会、关系体验与参与者解释；不同研究目的可以采用不同证据，不能自动相互替代。
  - question: 表达应该更简洁、更明确，还是允许冗余和歧义？
    papers:
      - B3
      - B4
      - X27
      - A3
    discussion: 讨论辨别需要、噪声、受众知识、幽默和关系功能；不预设一种表达策略在所有场景最好。
