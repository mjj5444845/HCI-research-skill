  - id: B1
    citation: Noah D. Goodman, Michael C. Frank (2016). Pragmatic Language Interpretation as Probabilistic
      Inference. Trends in Cognitive Sciences, 20(11), 818–829
    source_url: https://langcog.stanford.edu/papers_new/goodman-2016-tics.pdf
    exam_theme: 2
    rq: 如何形式化 speaker goals、context、world beliefs、utterance alternatives 与 listener inference？
    theory:
      - Rational Speech Act
      - uncertain RSA
      - probabilistic inverse planning
      - speaker utility and utterance cost
    method: 非系统性理论综述与计算建模综合；重建 basic RSA，并汇总 signaling-game、judgment、reference、figurative language 与 vagueness
      研究；没有原创实验样本。
    finding: RSA 在若干受限 signaling/reference tasks 中可量化拟合 human judgments，并可纳入 utterance cost、speaker uncertainty
      与不同 utilities。 深层 social recursion 的 evidence mixed；论文把 dialogue、partner utilities/goals、social
      goals、learning/language change 与 scalability 列为开放问题。
    limitation: narrative review 来自框架主要提出者；basic RSA 常预设 alternatives、utility、literal semantics 与 rational
      speaker，主要解释受限 listener judgments，而非在线 production/repair。
    relation_to_mainline: 服务近期情境化语用理解，检验信号、上下文、用意与解释之间的关系。
