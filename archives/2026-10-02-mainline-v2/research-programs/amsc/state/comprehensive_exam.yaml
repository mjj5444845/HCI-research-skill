  - id: C5
    citation: Robert X. D. Hawkins, Megumi Sano, Noah D. Goodman, Judith E. Fan (2019). Disentangling
      contributions of visual information and interaction history in the formation of graphical conventions.
      Proceedings of the 41st Annual Meeting of the Cognitive Science Society
    source_url: https://escholarship.org/uc/item/6408z76h
