    device_capabilities: Not verified; do not assume live sensing, output or multiuser support.
    budget: limited; no robot purchase planned
    technical_development: User reports able to build a system; actual workload still requires scoping
    participants: Campus adults, often students as general users; off-campus recruitment possible
    interaction_duration: One-off or repeated participation possible
